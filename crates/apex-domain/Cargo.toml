[package]
name = "apex-domain"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
apex-contract = { version = "0.1.0", path = "../apex-contract" }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10.9"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }

[features]
default = []
test-support = []

[lints.rust]
unsafe_code = "forbid"
