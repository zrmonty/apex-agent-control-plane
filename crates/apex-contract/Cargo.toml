[package]
name = "apex-contract"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "transport", "tls-ring"] }
tonic-prost = "0.14"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[lints.rust]
unsafe_code = "forbid"
