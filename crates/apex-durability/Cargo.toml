[package]
name = "apex-durability"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
apex-contract = { version = "0.1.0", path = "../apex-contract" }
apex-domain = { version = "0.1.0", path = "../apex-domain" }
apex-security = { version = "0.1.0", path = "../apex-security" }
async-nats = { version = "0.50.0", default-features = false, features = ["jetstream", "ring"] }
fs2 = "0.4"
getrandom = "0.4.3"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zeroize = "1.8"
postgres = { version = "0.19", optional = true, features = ["with-uuid-1"] }
tokio-postgres = { version = "=0.7.18", optional = true, features = ["with-uuid-1"] }
rustls-pki-types = { version = "1", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true, default-features = false, features = ["ring", "webpki-roots"] }
uuid = { version = "1", optional = true, features = ["v4"] }

[features]
default = []
test-support = ["apex-domain/test-support"]
postgres = ["dep:postgres", "dep:tokio-postgres", "dep:rustls-pki-types", "dep:tokio-postgres-rustls", "dep:uuid"]

[lints.rust]
unsafe_code = "forbid"
