[package]
name = "apex-control-plane-api"
version = "0.1.0"
edition = "2024"
# Internal service binary, not a crates.io library -- see deny.toml's
# `[licenses.private]`, which relies on this to skip the license check for
# this crate itself (dependency licenses are still checked normally).
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "apex-control-plane-api"
path = "src/main.rs"

[dependencies]
# Reuses the durable outbox, event-envelope validation/canonicalization, and
# GatewayError taxonomy from the ingest admission core instead of forking
# them. The OOB control gateway is a distinct authentication boundary and
# transport, not a distinct durability or event-contract story.
apex-event-ingest = { path = "../event-ingest" }
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "transport", "tls-ring"] }
tonic-prost = "0.14"
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[features]
default = []
test-support = ["apex-event-ingest/test-support"]
postgres = ["apex-event-ingest/postgres"]

[lints.rust]
unsafe_code = "forbid"
