[package]
name = "apex-control-plane-api"
version = "0.1.0"
edition = "2024"
# Internal service binary, not a crates.io library -- see deny.toml's
# `[licenses.private]`, which relies on this to skip the license check for
# this crate itself (dependency licenses are still checked normally).
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "apex-control-plane-api"
path = "src/main.rs"

[dependencies]
# Reuses the durable outbox, event-envelope validation/canonicalization, and
# GatewayError taxonomy from shared crates instead of depending on the ingest
# application. The OOB control gateway is a distinct authentication boundary
# and transport, not a distinct durability or event-contract story.
apex-auth = { version = "0.1.0", path = "../../crates/apex-auth" }
apex-durability = { version = "0.1.0", path = "../../crates/apex-durability" }
apex-policy = { version = "0.1.0", path = "../../crates/apex-policy" }
# Exclusive writer lock on the durable command-inbox journal, the same
# primitive and the same version `event-ingest`'s `FileOutbox` uses for its own
# journal. A second process appending to one journal would interleave delivery
# records and silently corrupt the "has this agent been told" state.
fs2 = "0.4"
# Operator credential verification for the production (Keycloak) resolver.
# Pinned to the 9.x line deliberately: it verifies through `ring`, which this
# dependency tree already carries for rustls, so no second crypto stack enters
# the build. jsonwebtoken 11 dropped `ring` in favour of either `aws-lc-rs`
# (a C library whose license set `deny.toml` does not allow, and which would
# need cmake/nasm in the container build) or `rust_crypto`, which pulls
# `rsa` 0.9 -- RUSTSEC-2023-0071, which `cargo audit` fails this repository on.
jsonwebtoken = "9.3.1"
prost = "0.14"
prost-types = "0.14"
postgres = { version = "0.19", optional = true, features = ["with-uuid-1"] }
# JWKS retrieval for the Keycloak resolver. Same client, same TLS stack, and
# the same "trust only the configured CA, never a platform root store"
# discipline as the shared HTTPS sinks. Declared directly because this crate
# uses it in its own right.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "signal", "net", "io-util"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "transport", "tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[dev-dependencies]
# Test-only: decodes the throwaway RSA fixture keys in `keycloak/tests.rs` and
# assembles the deliberately malformed tokens (`alg: none`) that no real
# signing library will produce. Never linked into the released binary.
base64 = "0.22"
# Paused/mocked time for deterministic tests of the interval-based fanout
# worker (see replay.rs's tests) -- real wall-clock sleeps racing a
# background tick is exactly the flake class two prior CI fixes in this repo
# already had to close elsewhere. Test-only: Cargo unions this with the main
# `tokio` dependency's features solely for test builds, so the release binary
# never links `test-util`.
tokio = { version = "1", features = ["test-util"] }

[features]
default = []
test-support = ["apex-auth/test-support", "apex-durability/test-support"]
postgres = ["apex-durability/postgres", "dep:postgres"]
# Cross-replica admission ceiling through `event-ingest`'s own Valkey
# accelerator -- reused, not forked, the same rule the outbox and the JetStream
# publisher already follow. Without it the ceiling is process-local, which with
# N replicas means N times the configured limit.
valkey = ["apex-auth/valkey"]

[lints.rust]
unsafe_code = "forbid"
