# cargo-deny configuration for the OOB control gateway.
# Run: cargo deny check
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" is tracked but does not fail CI
# on its own -- an unmaintained crate isn't a vulnerability until one is
# actually filed against it (which lands here as a normal advisory anyway).
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `apex-event-ingest` is an unpublished in-repo path dependency, so it has no
# version requirement to pin. That is not the unpinned-registry-crate risk
# `wildcards = "deny"` exists to catch; every external dependency is still
# version-constrained normally.
allow-wildcard-paths = true
deny = [
    # Never let an OpenSSL variant into the dependency tree: every TLS path
    # reachable from this crate (including everything it pulls in through
    # apex-event-ingest) is deliberately rustls-only. A transitive openssl
    # dependency would silently introduce a second, differently-configured
    # TLS stack.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
