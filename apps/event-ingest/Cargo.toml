[package]
name = "apex-event-ingest"
version = "0.1.0"
edition = "2024"
# Internal service binary, not a crates.io library -- see deny.toml's
# `[licenses.private]`, which relies on this to skip the license check for
# this crate itself (dependency licenses are still checked normally).
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
apex-contract = { path = "../../crates/apex-contract" }
async-nats = { version = "0.50.0", default-features = false, features = ["jetstream", "ring"] }
prost = "0.14"
prost-types = "0.14"
getrandom = "0.4.3"
fs2 = "0.4"
# "query": Phase 0.6 item 4's ClickHouse sink adds `async_insert`/
# `wait_for_async_insert` as request-level query parameters (see
# `http_sinks/publishers.rs`) rather than folding them into the configured
# endpoint string, which `AuthenticatedHttpConfig::build_client` deliberately
# rejects if it carries a query string at all.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# tonic 0.14 split its Prost codec/codegen out into tonic-prost. "tls-ring"
# replaces the old "tls" feature, matching this crate's rustls "ring" crypto
# provider.
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "transport", "tls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# PEM parsing only (RootCertStore population in postgres_transport.rs). Not
# rustls-pemfile: that crate is unmaintained (RUSTSEC-2025-0134) and its own
# advisory says to depend directly on the PEM support it wrapped, which has
# lived in rustls-pki-types since 1.9.0.
rustls-pki-types = { version = "1", optional = true }
zeroize = "1.8"
redis = { version = "1.5", optional = true, default-features = false, features = ["tls-rustls", "tls-rustls-webpki-roots"] }
postgres = { version = "0.19", optional = true, features = ["with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", optional = true, default-features = false, features = ["ring", "webpki-roots"] }
uuid = { version = "1", optional = true, features = ["v4"] }

[features]
default = []
test-support = []
# Optional Valkey (Redis-protocol) acceleration adapter. The in-memory
# EphemeralStore remains available without this feature.
valkey = ["dep:redis"]
# Multi-process authoritative outbox + idempotency (deploy/postgres/*.sql).
postgres = ["dep:postgres", "dep:tokio-postgres-rustls", "dep:rustls-pki-types", "dep:uuid"]

# In-process gateway/adapter/publisher suite, split by scenario: auth
# admission, JetStream publishing, envelope validation, idempotency/scope,
# diagnostics, transport configuration, and durable fanout.
[[test]]
name = "gateway_auth_admission"
path = "tests/gateway_auth_admission.rs"
required-features = ["test-support"]

[[test]]
name = "gateway_jetstream_publisher"
path = "tests/gateway_jetstream_publisher.rs"
required-features = ["test-support"]

[[test]]
name = "gateway_envelope_validation"
path = "tests/gateway_envelope_validation.rs"
required-features = ["test-support"]

[[test]]
name = "gateway_idempotency_and_scope"
path = "tests/gateway_idempotency_and_scope.rs"
required-features = ["test-support"]

[[test]]
name = "gateway_diagnostics"
path = "tests/gateway_diagnostics.rs"
required-features = ["test-support"]

[[test]]
name = "gateway_transport_config"
path = "tests/gateway_transport_config.rs"
required-features = ["test-support"]

[[test]]
name = "gateway_durable_fanout"
path = "tests/gateway_durable_fanout.rs"
required-features = ["test-support"]

[[test]]
name = "live_mtls"
path = "tests/live_mtls.rs"
required-features = ["test-support"]

# Adversarial data-admission corpus against a running gateway. Skips itself
# unless APEX_ADVERSARIAL_GATEWAY points at one, so offline CI stays green.
# Split by scenario: integrity/canonicalization, scope/replay, malformed
# payloads, and transport admission.
[[test]]
name = "adversarial_integrity"
path = "tests/adversarial_integrity.rs"
required-features = ["test-support"]

[[test]]
name = "adversarial_scope_and_replay"
path = "tests/adversarial_scope_and_replay.rs"
required-features = ["test-support"]

[[test]]
name = "adversarial_malformed_payloads"
path = "tests/adversarial_malformed_payloads.rs"
required-features = ["test-support"]

[[test]]
name = "adversarial_transport"
path = "tests/adversarial_transport.rs"
required-features = ["test-support"]

# Partial-landing / torn-write tests. Stops and starts sink containers, so it
# is opt-in via APEX_TORN_WRITE=1 in addition to the live gateway endpoint.
[[test]]
name = "torn_write"
path = "tests/torn_write.rs"
required-features = ["test-support"]

# SIGKILLs the gateway container itself mid-fanout, so it is opt-in via
# APEX_KILL_GATEWAY=1 on top of the live gateway endpoint. Split by scenario:
# a deterministic single-event kill (archive held down) and a concurrent
# load-stream kill (every sink healthy).
[[test]]
name = "gateway_kill_deterministic"
path = "tests/gateway_kill_deterministic.rs"
required-features = ["test-support"]

[[test]]
name = "gateway_kill_volley"
path = "tests/gateway_kill_volley.rs"
required-features = ["test-support"]

# Stops and blackholes the Valkey accelerator under load. Opt-in via
# APEX_VALKEY_OUTAGE=1; needs a gateway built with --features valkey.
[[test]]
name = "ephemeral_outage"
path = "tests/ephemeral_outage.rs"
required-features = ["test-support"]

# Transport attacks above the handshake: certificate swap on reconnect,
# negotiable compression, SQL metacharacters on the wire, per-request identity.
# Skips itself unless APEX_ADVERSARIAL_GATEWAY names a live gateway.
[[test]]
name = "transport_attacks"
path = "tests/transport_attacks.rs"
required-features = ["test-support"]

[lints.rust]
unsafe_code = "forbid"
