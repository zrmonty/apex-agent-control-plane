[package]
name = "apex-event-ingest"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
async-nats = { version = "0.50.0", default-features = false, features = ["jetstream", "ring"] }
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport", "tls"] }
zeroize = "1.8"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }

[dev-dependencies]

[features]
test-support = []

[[test]]
name = "gateway"
path = "tests/gateway.rs"
required-features = ["test-support"]

[lints.rust]
unsafe_code = "forbid"
