[package]
name = "apex-proxy-runtime-agent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Canonical wire types are generated independently, never imported from an app.
apex-contract = { version = "0.1.0", path = "../../crates/apex-contract" }
pbjson = "=0.9.0"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "transport", "tls-ring"] }
tonic-prost = "0.14"
url = "2"
uuid = "1"

[build-dependencies]
pbjson-build = "=0.9.0"
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[lints.rust]
unsafe_code = "forbid"
