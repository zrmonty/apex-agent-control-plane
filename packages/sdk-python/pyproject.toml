[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-sdk"
version = "0.1.0"
description = "Apex Agent Control Plane instrumentation SDK"
requires-python = ">=3.11"
dependencies = ["rfc8785==0.1.4"]

[project.optional-dependencies]
# cryptography: Ed25519 sign/verify for staging/production agent bundles
signing = ["cryptography>=42"]
# The generated protobuf modules are checked in, but their runtime and gRPC
# transport stay optional so importing apex_sdk needs neither dependency.
control = ["grpcio>=1.60", "protobuf>=4.25"]
ingest = ["grpcio>=1.60", "protobuf>=4.25"]
test = ["pytest>=9.0", "pytest-cov>=7.0", "cryptography>=42", "grpcio>=1.60", "protobuf>=4.25"]
dev = ["pytest>=9.0", "pytest-cov>=7.0", "cryptography>=42", "grpcio>=1.60", "protobuf>=4.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=apex_sdk --cov-branch --cov-report=term-missing --cov-fail-under=95"
