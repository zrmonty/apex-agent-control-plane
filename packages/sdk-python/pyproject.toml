[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-sdk"
version = "0.1.0"
description = "Apex Agent Control Plane instrumentation SDK"
requires-python = ">=3.11"
dependencies = ["rfc8785==0.1.4"]

[project.optional-dependencies]
# cryptography: Ed25519 sign/verify for staging/production agent bundles
signing = ["cryptography>=42"]
# control: the mTLS PollCommands client (apex_sdk.control_transport). Optional
# so importing apex_sdk never requires a gRPC stack -- the event-building,
# validation and bundle surfaces are useful without a control channel.
control = ["grpcio>=1.60"]
test = ["pytest>=9.0", "pytest-cov>=7.0", "cryptography>=42", "grpcio>=1.60"]
dev = ["pytest>=9.0", "pytest-cov>=7.0", "cryptography>=42", "grpcio>=1.60"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=apex_sdk --cov-branch --cov-report=term-missing --cov-fail-under=95"
