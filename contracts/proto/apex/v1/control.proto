syntax = "proto3";

package apex.v1;

import "google/protobuf/struct.proto";

// Out-of-band (OOB) control command gateway. Independently authenticated
// from the EventIngest data path (see event.proto): a distinct operator
// credential space, not the ingest workload bearer token. Every accepted
// command is durably enqueued to the same event outbox used by ingest and
// surfaces as a `control` event (EventType.CONTROL) in the queryable trace.
//
// Cooperative v1 semantics only (ADR-0005): this issues commands for the
// instrumented runtime to observe and act on. It never forcibly terminates
// or suspends a process.
//
// Two RPCs, two *different* credential spaces, and they must never be
// confused:
//
//   SubmitCommand  operator -> gateway. Authenticated with an operator
//                  credential (static table or Keycloak-issued, see
//                  control-plane-api/src/auth.rs and keycloak.rs).
//   PollCommands   agent workload -> gateway. Authenticated with the
//                  workload-identity model event-ingest already trusts for
//                  agent connections: mTLS client certificate pinned to a
//                  bearer credential bound to exactly one agent_id
//                  (control-plane-api/src/agent_auth.rs).
//
// An operator credential cannot poll and an agent credential cannot submit.
// That is ADR-0006's independence requirement carried inward: the authority
// to *issue* a stop and the authority to *retrieve* one are different
// authorities held by different principals.
service ControlGateway {
  rpc SubmitCommand(ControlCommandRequest) returns (ControlCommandResponse);

  // Retrieves the commands pending for the *calling agent*.
  //
  // Unary, deliberately, rather than server-streaming. Three reasons, all
  // about the property ADR-0006 exists to protect -- this channel staying
  // reachable when the rest of the platform is degraded:
  //
  //   1. A streaming RPC pins one gateway task, one HTTP/2 stream and one
  //      idle connection per agent for the lifetime of the run. A unary poll
  //      costs a bounded amount of work per call and nothing between calls,
  //      so a fleet of agents cannot exhaust the control channel simply by
  //      existing.
  //   2. A poll is trivially rate-limitable per caller. A long-lived stream
  //      is not: the cost is in holding it open, which no per-request ceiling
  //      sees.
  //   3. Idle long-lived streams are exactly what intermediaries (LBs, egress
  //      proxies, NAT) silently reap, and a control channel whose failure
  //      mode is "looks connected, delivers nothing" is the failure this
  //      whole work item exists to close.
  //
  // Delivery is at-least-once with idempotent consumers, the same
  // non-negotiable the event pipeline already holds: a command returned by a
  // poll whose response never reached the agent becomes visible again after
  // the gateway's redelivery window, so enactment must be idempotent
  // (stopping an already-stopped loop is a no-op, not an error).
  rpc PollCommands(PollCommandsRequest) returns (PollCommandsResponse);
  rpc AckCommand(AckCommandRequest) returns (AckCommandResponse);
  rpc GetCommandStatus(GetCommandStatusRequest) returns (GetCommandStatusResponse);

  // Enumerates commands recorded for a scope -- "what is currently pending
  // here" -- for an operator who does not yet know a command_id, which is
  // exactly the gap GetCommandStatus cannot close: it requires one. This is
  // the natural precursor to an operator-facing dashboard: it exposes
  // nothing GetCommandStatus/PollCommands do not already expose per command,
  // just a scoped, paginated view across many of them at once.
  //
  // Operator-authenticated and scope-checked exactly like GetCommandStatus:
  // the operator credential space, never the agent one, and the same
  // allows_scope(workspace_id, namespace_id) check. Genuinely paginated and
  // bounded, the same discipline PollCommands' max_commands already applies:
  // page_size is clamped into the gateway's own ceiling, and page_token is a
  // cursor -- resume strictly after the last-seen command -- never an
  // offset, so a scope being concurrently written to while an operator pages
  // through it cannot shift already-returned rows or cause a skip/repeat.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);

  // Retracts a command an operator issued, before it has reached its target
  // agent. Operator-authenticated and scope-checked exactly like
  // GetCommandStatus -- this is the operator's side of the same delivery
  // question AckCommand answers from the agent's side.
  //
  // Cancellation succeeds only while the command has never been delivered
  // (its delivery attempt count is still zero). Once a poll has handed the
  // command to its agent even once, the gateway refuses to cancel it: the
  // agent may already be acting on it, and retracting a command it already
  // has would recreate exactly the "did the agent get it or not" ambiguity
  // this whole delivery-tracking design (see control-plane-api/src/inbox.rs)
  // exists to eliminate. Issue a new command instead.
  rpc CancelCommand(CancelCommandRequest) returns (CancelCommandResponse);

  // Fans one command out to an explicit, operator-provided list of targets in
  // a single call -- what would otherwise be that many separate
  // `SubmitCommand` calls during an incident, issued as one. Not a broadcast:
  // this gateway has no agent registry and cannot resolve "every agent in
  // this namespace" on its own, so every target must be named by the caller.
  // See `MAX_BULK_COMMAND_TARGETS` (control-plane-api/src/service.rs) for the
  // hard ceiling on how many targets one call may name.
  //
  // Partial failure is the normal outcome, not an exceptional one: each
  // target is authorized and durably recorded independently through the same
  // path a single `SubmitCommand` uses, so one target being outside the
  // operator's scope (or any other per-target failure) never blocks the
  // targets that are valid. The response reports, for every requested
  // target, whether it was accepted and -- if not -- which of this gateway's
  // existing error codes (errors.rs) explains why.
  rpc SubmitBulkCommand(SubmitBulkCommandRequest) returns (SubmitBulkCommandResponse);
}

message ControlCommandRequest {
  // Caller-supplied lowercase UUIDv7 idempotency key. Optional: the gateway
  // generates one when omitted. Resubmitting the same command_id with the
  // same fields is a no-op duplicate; resubmitting it with different fields
  // is rejected as an idempotency conflict.
  optional string command_id = 1;
  string workspace_id = 2;
  string namespace_id = 3;
  string agent_id = 4;
  string run_id = 5;
  optional string parent_run_id = 6;
  string trace_id = 7;
  ControlAction action = 8;
  optional string reason_code = 9;
  // Action-specific object. `inject.content` is untrusted data and must
  // never be promoted into instructions or authorization decisions by any
  // downstream consumer.
  google.protobuf.Struct parameters = 10;
}

message ControlCommandResponse {
  // True when this command_id was already durably accepted with the same
  // fields (idempotent replay), false on first acceptance.
  bool duplicate = 1;
  string command_id = 2;
  // True once the durable outbox row has been marked complete (fanned out
  // to the JetStream/ClickHouse trace). False means the command was
  // durably accepted but fanout is still pending -- for example while the
  // primary data path is degraded. The command is not lost either way.
  bool delivered = 3;
  // True when `action == FORCE_STOP` and this submission recorded only the
  // *first* of the two required operator approvals -- the command has NOT
  // been enqueued and `delivered` is meaningless (always false). A second,
  // distinct operator must resubmit `SubmitCommand` with the identical
  // `command_id` and identical fields for the command to be recorded. Always
  // false for every other action, and false once the second approval has
  // landed and the `force_stop` was actually recorded.
  bool awaiting_second_approval = 4;
}

// A poll carries **no** target selector.
//
// There is deliberately no `agent_id`, `run_id`, `workspace_id` or
// `namespace_id` field here, and adding one later would be a security change,
// not a feature. The gateway derives the caller's agent identity and its
// permitted workspace/namespace scopes entirely from the authenticated
// workload credential, and returns only commands matching it. The server
// derives and enforces caller scope; client-supplied filters never expand
// access.
message PollCommandsRequest {
  // Client hint for the maximum number of commands to return in this
  // response. The gateway clamps it into its own bounds and applies its own
  // default when zero. It can only ever *narrow* a result set the caller was
  // already entitled to; it is not, and must never become, a selector.
  uint32 max_commands = 1;
}

message PollCommandsResponse {
  // Commands pending for the calling agent, oldest first. Empty is the normal
  // case and is not an error.
  repeated PendingControlCommand commands = 1;
  // The agent identity the gateway resolved from the caller's own credential.
  // Echoed so a client can assert it is polling as the workload it believes
  // it is, and so a misconfigured credential is a loud mismatch rather than a
  // silent stream of somebody else's commands. It is derived from the
  // credential, never from the request.
  string agent_id = 2;
  // The minimum interval, in seconds, the gateway wants between polls from
  // this caller. A cooperative client that honours it will not be
  // rate-limited; the gateway enforces its own ceiling regardless.
  uint32 min_poll_interval_seconds = 3;
}

message AckCommandRequest {
  string workspace_id = 1;
  string namespace_id = 2;
  string command_id = 3;
  uint32 delivery_attempt = 4;
}

message AckCommandResponse {
  string command_id = 1;
  bool acknowledged = 2;
  bool already_acknowledged = 3;
}

message GetCommandStatusRequest {
  string workspace_id = 1;
  string namespace_id = 2;
  string command_id = 3;
}

message GetCommandStatusResponse {
  string command_id = 1;
  CommandDeliveryState state = 2;
  uint32 delivery_attempt = 3;
}

enum CommandDeliveryState {
  COMMAND_DELIVERY_STATE_UNSPECIFIED = 0;
  COMMAND_DELIVERY_PENDING = 1;
  COMMAND_DELIVERY_DELIVERED = 2;
  COMMAND_DELIVERY_ACKNOWLEDGED = 3;
  COMMAND_DELIVERY_EXHAUSTED = 4;
  // An operator cancelled this command via CancelCommand before it was ever
  // delivered. Durable and terminal, the same as ACKNOWLEDGED -- a status
  // query after a restart must still report CANCELLED rather than falling
  // back to UNSPECIFIED, which would be indistinguishable from a command_id
  // that was never issued at all.
  COMMAND_DELIVERY_CANCELLED = 5;
}

message PendingControlCommand {
  string command_id = 1;
  string workspace_id = 2;
  string namespace_id = 3;
  string agent_id = 4;
  string run_id = 5;
  string trace_id = 6;
  ControlAction action = 7;
  optional string reason_code = 8;
  // Action-specific object, byte-identical to what the operator submitted.
  // `inject.content` remains untrusted data and must never be promoted into
  // instructions or authorization decisions by the receiving runtime.
  google.protobuf.Struct parameters = 9;
  // RFC 3339 UTC timestamp the gateway recorded for this command, derived
  // from the command_id's own UUIDv7 clock (see envelope.rs) so it matches
  // the `control` event in the queryable trace exactly.
  string issued_at = 10;
  // 1 on first delivery, incremented on every redelivery. A value above 1
  // means a previous poll response for this command was not observed to have
  // been acted on -- useful for the receiving runtime's own diagnostics, and
  // never a reason to treat the command differently.
  uint32 delivery_attempt = 11;
}

enum ControlAction {
  CONTROL_ACTION_UNSPECIFIED = 0;
  STOP = 1;
  PAUSE = 2;
  RESUME = 3;
  INJECT = 4;
  SET_BUDGET = 5;
  // Delivers an operator decision (approve/deny) for a specific hold a
  // waiting agent is blocked on -- the shared delivery primitive
  // [[Human-in-the-Loop Approvals]]'s blocking mode and
  // [[Defense-Evasion Interception]]'s hold tier both need to get a decision
  // back to the tool call that requested it. `parameters` carries
  // `hold_token` (the identifier the agent generated when it entered the
  // held state), `decision` (`"approved"` or `"denied"`), and an optional
  // operator-supplied `reason`. See `resolve_hold` handling in
  // `apps/control-plane-api/src/envelope.rs` and
  // `packages/sdk-python/src/apex_sdk/reference_runtime.py`.
  RESOLVE_HOLD = 6;
  // Non-cooperative. Delivered to a run's `apps/agent-supervisor` process
  // (its own distinct workload identity -- never the supervised agent's own
  // credential) rather than to the agent's own poll loop, and enacted by
  // killing the agent's whole OS process group rather than by the agent
  // choosing to honor it. See `apps/agent-supervisor`'s crate docs and
  // ADR-0005's "Alternatives considered" for why this is a different
  // enforcement class from the other five actions, and why `SubmitCommand`
  // requires two distinct operator approvals before recording it (see
  // `ControlCommandResponse.awaiting_second_approval`).
  FORCE_STOP = 7;
}

message ListCommandsRequest {
  string workspace_id = 1;
  string namespace_id = 2;
  // Narrows to one agent's commands. Unset returns every agent's commands in
  // scope. Like PollCommands' max_commands, this can only ever narrow a
  // result set the caller was already entitled to; there is no field here
  // that can widen past workspace_id/namespace_id.
  optional string agent_id = 3;
  // Narrows to one delivery state. COMMAND_DELIVERY_STATE_UNSPECIFIED (the
  // default) returns commands in every state.
  CommandDeliveryState state = 4;
  // Client hint for the maximum number of summaries to return. The gateway
  // clamps it into its own bounds (DEFAULT_LIST_COMMANDS_PAGE_SIZE /
  // MAX_LIST_COMMANDS_PAGE_SIZE in inbox.rs) and applies its own default when
  // zero.
  uint32 page_size = 5;
  // Opaque continuation cursor from a previous response's next_page_token.
  // Empty starts from the beginning of the scope. This is a cursor, not an
  // offset: the gateway resumes strictly after the last command the caller
  // already saw, so commands recorded, delivered, or settled by others while
  // this caller pages through a large scope can never shift already-returned
  // rows or cause the caller to skip or repeat one the way an OFFSET would.
  string page_token = 6;
}

message ListCommandsResponse {
  // Command summaries in the scope, oldest first, matching any filters.
  // Empty is the normal case for an idle scope and is not an error.
  repeated CommandSummary commands = 1;
  // Pass back as the next request's page_token to continue. Empty means
  // there is nothing more to page through.
  string next_page_token = 2;
}

// The subset of a command's identity and delivery state useful for an
// operator scanning a scope -- exactly the fields GetCommandStatus and
// PendingControlCommand already expose for this, and nothing else: no
// parameters, no run_id/trace_id/reason_code. An operator who needs those
// already has the command_id this carries and can look up the full record.
message CommandSummary {
  string command_id = 1;
  string agent_id = 2;
  ControlAction action = 3;
  CommandDeliveryState state = 4;
  uint32 delivery_attempt = 5;
  string issued_at = 6;
}

message CancelCommandRequest {
  string workspace_id = 1;
  string namespace_id = 2;
  string command_id = 3;
}

message CancelCommandResponse {
  string command_id = 1;
  // True when this call is the one that cancelled the command.
  bool cancelled = 2;
  // True when the command was already cancelled by an earlier call
  // (idempotent replay of the operator's own cancellation).
  bool already_cancelled = 3;
}

// One target of a bulk command: everything `ControlCommandRequest` needs to
// identify a target agent and its run, minus the fields a bulk call hoists up
// to the request so they apply identically to every target (`action`,
// `reason_code`, `parameters`).
//
// `workspace_id`/`namespace_id` are per-target, not a single request-level
// pair, on purpose: an operator's authorization is checked independently for
// every target, and a request-level scope field would make that check
// trivial rather than real -- see `SubmitBulkCommand`'s own comment. A bulk
// call whose targets happen to share one workspace/namespace, which is the
// common "stop everyone in this namespace" incident shape, simply repeats the
// same two values across its target list.
message BulkCommandTarget {
  string workspace_id = 1;
  string namespace_id = 2;
  string agent_id = 3;
  string run_id = 4;
  optional string parent_run_id = 5;
  string trace_id = 6;
}

message SubmitBulkCommandRequest {
  // Caller-supplied lowercase UUIDv7 idempotency key for the *bulk
  // submission itself*, not per target. Optional: the gateway generates one
  // when omitted, exactly like `ControlCommandRequest.command_id`. Every
  // target's own `command_id` is deterministically derived from this id plus
  // that target's own fields (see
  // `control-plane-api/src/envelope.rs::derive_target_command_id`), so
  // resubmitting the same `bulk_id` against the same targets is an idempotent
  // no-op for every one of them -- the same retry contract `SubmitCommand`
  // already gives a single target, extended across the batch rather than
  // reinvented for it. An operator does not have to generate or track one
  // idempotency key per target.
  optional string bulk_id = 1;
  // Bounded by `MAX_BULK_COMMAND_TARGETS`. Must be non-empty.
  repeated BulkCommandTarget targets = 2;
  ControlAction action = 3;
  optional string reason_code = 4;
  // Action-specific object, applied identically to every target. Same
  // `inject.content`-is-untrusted-data rule as
  // `ControlCommandRequest.parameters`.
  google.protobuf.Struct parameters = 5;
}

message SubmitBulkCommandResponse {
  string bulk_id = 1;
  // One result per requested target, in the same order as
  // `SubmitBulkCommandRequest.targets`. Always exactly that many results --
  // there is no target this response is silent about.
  repeated BulkCommandResult results = 2;
}

message BulkCommandResult {
  string workspace_id = 1;
  string namespace_id = 2;
  string agent_id = 3;
  bool accepted = 4;
  // Set when `accepted` is true; mirrors `ControlCommandResponse`.
  optional string command_id = 5;
  optional bool duplicate = 6;
  optional bool delivered = 7;
  // Set when `accepted` is false. `error_code` is one of this gateway's
  // existing `CommandErrorCode` values (errors.rs) -- never a bulk-specific
  // taxonomy -- so a caller that already handles `SubmitCommand` errors
  // handles a rejected bulk target without a new case.
  optional string error_code = 8;
  optional string error_message = 9;
}
