name: Live mTLS + E2E

on:
  # Keep required unit CI green on every PR. Live mTLS is still run on main pushes
  # but does not block merges if the runner Docker networking is flaky; also
  # available via workflow_dispatch for debugging.
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-mtls-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # grpcio: the live stop-enactment proof runs a real Python agent process
      # using the product SDK's own mTLS PollCommands transport
      # (packages/sdk-python/src/apex_sdk/control_transport.py).
      - name: Install Python tools
        run: python -m pip install -U pip cryptography boto3 "grpcio>=1.60"

      # Mirrors deploy/compose/e2e/run_gates.py (Linux path for GitHub-hosted runners).
      - name: Generate live-mTLS PKI and configs
        working-directory: deploy/compose/live-mtls
        run: |
          set -euo pipefail
          python generate_pki.py --out secrets
          python render_configs.py
          # Docker mount tree: keys must be world-readable for non-root service images.
          # Compose on Linux ignores secret mode/uid/gid. Lab fixtures only.
          chmod 644 secrets/*.pem secrets/*.key 2>/dev/null || true
          chmod 644 secrets/nats.conf secrets/valkey.conf secrets/valkey.acl secrets/control-valkey.acl 2>/dev/null || true
          # generate_pki.py writes nats-username AND nats-password with the same
          # runtime-secret helper, both restrictive by default; only nats-username
          # was ever widened here. gateway-secrets-init (compose.gateway-ref.yaml)
          # runs as uid 10001 and needs nats_password too -- unlike this Windows/WSL
          # dev environment, a native Linux runner actually enforces chmod 0600, so
          # this only ever failed on GitHub Actions, never reproduced locally.
          chmod 644 secrets/nats-username secrets/nats-password 2>/dev/null || true
          # Same class of failure, same fix, for the control gateway: the
          # operator token table is written 0600 owned by the runner, and
          # control-secrets-init runs as uid 10002, so it cannot read the
          # bind-mounted host file without this. The staged copy inside the
          # container is chmod 0600 by that init step, and the gateway's own
          # permission check still fails closed if the step is skipped.
          # Same for the control gateway's own NATS account files, added when
          # the fanout worker was wired in: control-secrets-init stages them
          # into the container at 0600, but it has to be able to read the
          # bind-mounted host file first.
          # Same again for the control gateway's own Valkey ACL credential,
          # added with the cross-replica admission ceiling: control-secrets-init
          # (uid 10002) stages it into the container at 0600, but it has to be
          # able to read the bind-mounted host file first.
          # Same again for the agent workload credential table, added with
          # PollCommands: control-secrets-init (uid 10002) stages it into the
          # container at 0600 but has to read the bind-mounted host file first.
          # The -a/-b single-entry copies are host-side only (the live proof's
          # Python agent and the Rust isolation test read them) and stay 0600.
          chmod 644 secrets/control-operator-tokens secrets/control-agent-tokens secrets/control-nats-username secrets/control-nats-password secrets/valkey-control-password 2>/dev/null || true
          if [ ! -f secrets/ingest-bearer-token ]; then
            printf 'gateway-ref-token' > secrets/ingest-bearer-token
            chmod 644 secrets/ingest-bearer-token
          fi
          # Fingerprint of authorized gRPC client cert (for gateway-ref compose config).
          python - <<'PY'
          from pathlib import Path
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes
          from generate_pki import write_host_secrets
          pem = Path("secrets/ingest-http-client.pem").read_bytes()
          cert = x509.load_pem_x509_certificate(pem)
          fp = cert.fingerprint(hashes.SHA256()).hex()
          Path("secrets/ingest-http-client.sha256").write_text(fp + "\n", encoding="ascii")
          # Host tree for cargo tests: private material must be mode 0600
          # (event-ingest rejects group/world bits on private keys and credentials).
          host = write_host_secrets(Path("secrets").resolve())
          print("host_secrets=" + str(host))
          print("APEX_BEARER_CERT_SHA256=" + fp)
          PY
          # Re-assert host private modes after any later writes into secrets/.
          chmod 600 secrets-host/*.key secrets-host/*password* secrets-host/nats-username 2>/dev/null || true
          if [ -f secrets-host/ingest-bearer-token ]; then chmod 600 secrets-host/ingest-bearer-token; fi
          ls -la secrets | head -40
          ls -la secrets-host | head -40

      - name: Start and wait for live-mTLS stack
        working-directory: deploy/compose/live-mtls
        run: |
          set -eu
          # Same fingerprint for provider write binding and gateway bearer cert binding.
          FP="$(tr -d '[:space:]' < secrets/ingest-http-client.sha256)"
          export APEX_PROVIDER_CLIENT_CERT_SHA256="$FP"
          export APEX_BEARER_CERT_SHA256="$FP"
          export APEX_LIVE_MTLS_SECRETS="$PWD/secrets"
          echo "Using client cert fingerprint: $FP"
          docker compose -f compose.yaml down --remove-orphans || true
          docker compose -f compose.yaml build clickhouse-projection archive-provider
          # Prefer --wait when available; fall back to plain up + TCP waiter.
          if docker compose -f compose.yaml up -d --force-recreate --remove-orphans --wait --wait-timeout 180; then
            echo "compose --wait succeeded"
          else
            echo "compose --wait failed; falling back to up + TCP wait"
            docker compose -f compose.yaml up -d --force-recreate --remove-orphans
          fi
          docker compose -f compose.yaml ps -a
          docker compose -f compose.yaml logs --tail 80
          python "${GITHUB_WORKSPACE}/deploy/compose/e2e/wait_live_mtls.py" \
            --secrets "$APEX_LIVE_MTLS_SECRETS" \
            --attempts 60 \
            --sleep 2 \
            --tcp-only
          python "${GITHUB_WORKSPACE}/deploy/compose/e2e/wait_live_mtls.py" \
            --secrets "$APEX_LIVE_MTLS_SECRETS" \
            --attempts 15 \
            --sleep 2 \
            || echo "HTTPS /health probe did not pass; cargo tests will verify mTLS."

      - name: Start E2E compose (Postgres, MinIO)
        working-directory: deploy/compose
        run: |
          set -eu
          # Compose still interpolates unused services in compose.e2e.yaml.
          FP="$(tr -d '[:space:]' < live-mtls/secrets/ingest-http-client.sha256)"
          export APEX_PROVIDER_CLIENT_CERT_SHA256="$FP"
          export APEX_BEARER_CERT_SHA256="$FP"
          docker compose -f compose.e2e.yaml down --remove-orphans || true
          # Only Postgres + MinIO for durability / Object-Lock (avoid competing ref providers).
          docker compose -f compose.e2e.yaml up -d --force-recreate postgres minio
          docker compose -f compose.e2e.yaml ps -a

      - name: Wait for E2E Postgres and MinIO
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/15432) >/dev/null 2>&1 \
              && (echo > /dev/tcp/127.0.0.1/19000) >/dev/null 2>&1; then
              echo "Postgres and MinIO ports are open (attempt $attempt)."
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/compose.e2e.yaml ps -a || true
          docker compose -f deploy/compose/compose.e2e.yaml logs --tail 40 || true
          echo "Timed out waiting for Postgres/MinIO." >&2
          exit 1

      - name: Live mTLS client tests
        working-directory: apps/event-ingest
        env:
          APEX_LIVE_MTLS: "1"
          # Use host-restricted tree (0600 keys). Docker still mounts secrets/ (0644).
          APEX_LIVE_MTLS_SECRETS: ${{ github.workspace }}/deploy/compose/live-mtls/secrets-host
          APEX_ALLOW_LOOPBACK_SINKS: "1"
        run: cargo test --test live_mtls --features "test-support,valkey" -- --nocapture

      - name: PostgreSQL durability tests
        working-directory: apps/event-ingest
        env:
          # Explicit loopback + sslmode=disable is the only approved plaintext path,
          # and now also requires this separate, loudly-named opt-in so plaintext can
          # never be reached by a bare connection string alone.
          APEX_POSTGRES_URL: postgres://apex:apex_e2e_local_only@127.0.0.1:15432/apex?sslmode=disable
          APEX_ALLOW_POSTGRES_PLAINTEXT: "1"
          # Each postgres_* test opens its own connection via connect(); any
          # transport-level failure (even a transient one under concurrent
          # connection load) is deliberately mapped to the same generic
          # InvalidIdempotencyConfiguration/InvalidOutboxConfiguration error
          # as a real config problem, so these must run one at a time rather
          # than risk the default multi-threaded runner opening many
          # connections to the loopback Postgres at once.
          RUST_TEST_THREADS: "1"
        run: cargo test --lib --features "postgres,test-support" postgres_ -- --nocapture

      - name: Object-Lock acceptance (MinIO)
        working-directory: deploy/compose
        env:
          MINIO_ENDPOINT: http://127.0.0.1:19000
          MINIO_ACCESS_KEY: apexminio
          MINIO_SECRET_KEY: apexminio_e2e_local_only
          MINIO_BUCKET: apex-events
        # Lab MinIO proves GOVERNANCE retention + versioning; legal-hold API
        # may still be partial depending on botocore/MinIO checksum negotiation.
        run: python object_lock_acceptance.py --allow-missing-legal-hold

      - name: Azure/GCS acceptance (optional without credentials)
        working-directory: deploy/compose
        env:
          APEX_CLOUD_ACCEPTANCE_OPTIONAL: "1"
        run: |
          python object_lock_acceptance_azure.py
          python object_lock_acceptance_gcs.py

      # `docker compose config` parses YAML. It never builds an image and never
      # starts a process, which is why a Dockerfile that could not build, a
      # binary that panicked before binding a listener, an unwritable data
      # volume, secret material the gateway refuses by policy, and a missing
      # JetStream stream all reached main. Every other test drives the gateway
      # in-process as a library. This job builds the real image and drives real
      # gRPC through the running container.
      - name: Build and smoke-start the gateway image
        working-directory: deploy/compose
        timeout-minutes: 30
        run: |
          set -euo pipefail
          FP="$(tr -d '[:space:]' < live-mtls/secrets/ingest-http-client.sha256)"
          export APEX_BEARER_CERT_SHA256="$FP"
          export APEX_PROVIDER_CLIENT_CERT_SHA256="$FP"
          P="-p apex-gateway-ref-ci -f compose.gateway-ref.yaml"
          docker compose $P down -v --remove-orphans || true
          docker compose $P build ingest-gateway
          # The optional-feature build is a separate artifact and broke
          # separately: --features postgres compiles deploy/postgres/*.sql via
          # include_str!, so a context omitting that directory fails outright
          # and no image with the Postgres backends could be produced at all.
          GATEWAY_CARGO_FEATURES=valkey,postgres docker compose $P build ingest-gateway
          # Serve the default-feature image.
          docker compose $P build ingest-gateway
          # Named explicitly rather than bare `up -d`. This profile now also
          # defines the control gateway and its own secrets-init, and a bare
          # `up -d` would start those here too -- so a control-side init
          # failure would fail *this* step, under the gateway's name, with
          # only the gateway's logs printed. Compose still starts everything
          # ingest-gateway depends_on.
          docker compose $P up -d --force-recreate ingest-gateway
          for attempt in $(seq 1 90); do
            state="$(docker compose $P ps -a --format '{{.Name}} {{.State}}' | grep ingest-gateway || true)"
            case "$state" in
              *exited*)
                echo "gateway container exited: $state" >&2
                docker compose $P logs --no-color ingest-gateway >&2
                exit 1
                ;;
            esac
            if (echo > /dev/tcp/127.0.0.1/18445) >/dev/null 2>&1; then
              echo "gateway serving on 127.0.0.1:18445 (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done
          docker compose $P ps -a >&2
          docker compose $P logs --no-color --tail 120 >&2
          echo "gateway never began serving" >&2
          exit 1

      # Same reasoning as the gateway step above, for the service that had none
      # of it: apps/control-plane-api shipped with no Dockerfile and no Compose
      # entry at all, so nothing anywhere proved its image could build, its
      # binary could bind, or its container could write its outbox volume.
      # `docker compose config` in the overlay-validation step below would
      # happily pass on a Dockerfile that does not compile.
      - name: Build and smoke-start the control gateway image
        working-directory: deploy/compose
        timeout-minutes: 30
        run: |
          set -euo pipefail
          P="-p apex-gateway-ref-ci -f compose.gateway-ref.yaml"
          docker compose $P build control-plane-api
          # The --features postgres artifact is built and, more importantly,
          # *run* by the "Postgres-backed control gateway" step below, under
          # its own image tag. It used to be built here and then thrown away,
          # which caught a build break (deploy/postgres/*.sql is compiled in
          # via include_str!, so a narrow build context fails outright) but
          # could not catch a runtime one -- and there was one: the binary
          # panicked on start with "Cannot start a runtime from within a
          # runtime" the first time a real container used that backend.
          docker compose $P up -d --force-recreate control-plane-api
          for attempt in $(seq 1 90); do
            state="$(docker compose $P ps -a --format '{{.Name}} {{.State}}' | grep control-plane-api || true)"
            case "$state" in
              *exited*)
                echo "control gateway container exited: $state" >&2
                docker compose $P logs --no-color control-secrets-init control-plane-api >&2
                exit 1
                ;;
            esac
            if (echo > /dev/tcp/127.0.0.1/18446) >/dev/null 2>&1; then
              echo "control gateway serving on 127.0.0.1:18446 (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done
          docker compose $P ps -a >&2
          docker compose $P logs --no-color --tail 120 control-secrets-init control-plane-api >&2
          echo "control gateway never began serving" >&2
          exit 1

      # An open TCP port only proves the process bound one. These drive real
      # gRPC over real mTLS and, critically, prove the negative cases: a client
      # with no certificate and a client holding a certificate from an
      # untrusted CA must both be stopped at the handshake, while a trusted
      # certificate with no operator token must reach the application and come
      # back Unauthenticated. Nothing else in CI can catch a TLS gate that
      # silently made client certificates optional -- every other test drives
      # the service in-process, where ServerTlsConfig is never built at all.
      - name: Live control-gateway mTLS tests
        working-directory: apps/control-plane-api
        timeout-minutes: 15
        env:
          APEX_CONTROL_LIVE_MTLS: "1"
          APEX_CONTROL_LIVE_ENDPOINT: https://localhost:18446
          # Host-restricted tree (0600 keys); Docker still mounts secrets/.
          APEX_CONTROL_LIVE_SECRETS: ${{ github.workspace }}/deploy/compose/live-mtls/secrets-host
          APEX_CONTROL_LIVE_ADVERSARIAL_PKI: ${{ github.workspace }}/deploy/compose/live-mtls/adversarial
        run: |
          set -euo pipefail
          # The adversarial step below regenerates these unconditionally; mint
          # them here only if absent, so this gate does not have to wait on a
          # 25-minute step to learn whether the TLS boundary holds.
          if [ ! -f "${GITHUB_WORKSPACE}/deploy/compose/live-mtls/adversarial/wrong-ca-client.pem" ]; then
            python "${GITHUB_WORKSPACE}/deploy/compose/e2e/generate_adversarial_pki.py" \
              --out "${GITHUB_WORKSPACE}/deploy/compose/live-mtls/adversarial"
          fi
          cargo test --test live_control_mtls -- --nocapture --test-threads=1

      # The step above proves a command is *accepted*. Until the fanout worker
      # was wired into the binary, that was the whole story: every accepted
      # command sat in the outbox forever, `delivered` was permanently false,
      # and no `control` event ever reached the trace -- with every test in
      # this workflow still green, because none of them asked the broker
      # anything. This one does, and it deliberately does not read `delivered`
      # back from the service that would be the thing at fault.
      - name: Verify control commands reach JetStream
        working-directory: deploy/compose
        timeout-minutes: 10
        run: |
          set -euo pipefail
          P="-p apex-gateway-ref-ci -f compose.gateway-ref.yaml"
          docker compose $P run --rm control-fanout-verify || {
            echo "control fanout never delivered; gateway logs follow" >&2
            docker compose $P logs --no-color --tail 120 control-plane-api jetstream >&2
            exit 1
          }

      # The gate this pass's central claim lives or dies on.
      #
      # Every step above proves a command is accepted, recorded, and reaches
      # the queryable trace. None of them proves the thing an operator
      # actually wants: that the agent stops. Until PollCommands existed, no
      # code path anywhere in this repository let an agent receive a command
      # at all, and the entire suite above stayed green throughout -- which is
      # exactly why this needs its own gate rather than trust in the component
      # tests.
      #
      # It starts a real Python agent process using the product SDK's own
      # mTLS transport, submits a real `stop` through the already-working
      # SubmitCommand RPC, and asserts the agent halted naming *that*
      # command_id. Run after the fanout verification above, deliberately:
      # that step reads the last message on the subject, so a command
      # submitted here first would displace the one it looks for.
      - name: Live proof -- an operator stop halts a real agent process
        working-directory: apps/control-plane-api
        timeout-minutes: 15
        env:
          APEX_CONTROL_LIVE_POLL: "1"
          APEX_CONTROL_LIVE_ENDPOINT: https://localhost:18446
          APEX_CONTROL_LIVE_SECRETS: ${{ github.workspace }}/deploy/compose/live-mtls/secrets-host
          APEX_CONTROL_LIVE_PYTHON: python
        run: cargo test --test live_control_poll --features test-support -- --nocapture --test-threads=1

      # `--features postgres` used to change nothing about the running binary:
      # open_outbox() unconditionally built a FileOutbox and the feature only
      # forwarded the dependency to apex-event-ingest. Building that artifact
      # proved it compiled; nothing ran it, so the panic it took on the first
      # real container start ("Cannot start a runtime from within a runtime",
      # because the sync postgres client drives its own runtime on every
      # query) was invisible. This builds it, runs two replicas of it against
      # a real TLS Postgres, and drives concurrent traffic at both.
      - name: Postgres-backed control gateway (two replicas)
        working-directory: deploy/compose
        timeout-minutes: 30
        run: |
          set -euo pipefail
          P="-p apex-gateway-ref-ci -f compose.gateway-ref.yaml -f compose.control-pg.yaml"
          docker compose $P build control-plane-api-pg-a
          docker compose $P up -d --force-recreate control-plane-api-pg-a control-plane-api-pg-b
          for attempt in $(seq 1 90); do
            state="$(docker compose $P ps -a --format '{{.Name}} {{.State}}' | grep control-plane-api-pg || true)"
            case "$state" in
              *exited*)
                echo "a Postgres-backed replica exited: $state" >&2
                docker compose $P logs --no-color control-postgres control-plane-api-pg-a control-plane-api-pg-b >&2
                exit 1
                ;;
            esac
            if (echo > /dev/tcp/127.0.0.1/18447) >/dev/null 2>&1 \
              && (echo > /dev/tcp/127.0.0.1/18448) >/dev/null 2>&1; then
              echo "both Postgres-backed replicas serving (attempt $attempt)"
              break
            fi
            if [ "$attempt" = 90 ]; then
              docker compose $P ps -a >&2
              docker compose $P logs --no-color --tail 120 control-postgres control-plane-api-pg-a control-plane-api-pg-b >&2
              echo "Postgres-backed replicas never began serving" >&2
              exit 1
            fi
            sleep 2
          done
          # An open port is not proof of the backend. Both of these are:
          # the outbox row must be in Postgres, and the file outbox must not
          # exist -- a silent fallback to FileOutbox would satisfy neither.
          docker compose $P logs --no-color control-plane-api-pg-a \
            | grep -q 'outbox backend: postgres' \
            || { echo "replica A did not select the Postgres backend" >&2; exit 1; }

      - name: Live two-replica Postgres tests
        working-directory: apps/control-plane-api
        timeout-minutes: 15
        env:
          APEX_CONTROL_LIVE_POSTGRES: "1"
          APEX_CONTROL_LIVE_SECRETS: ${{ github.workspace }}/deploy/compose/live-mtls/secrets-host
        run: cargo test --test live_control_postgres -- --nocapture --test-threads=1

      - name: Confirm control commands landed in Postgres, not a file
        working-directory: deploy/compose
        timeout-minutes: 10
        run: |
          set -euo pipefail
          P="-p apex-gateway-ref-ci -f compose.gateway-ref.yaml -f compose.control-pg.yaml"
          query() {
            docker compose $P exec -T control-postgres \
              psql -U apex -d apex_control -tAc "$1" | tr -d '[:space:]'
          }
          rows="$(query 'SELECT count(*) FROM apex_event_outbox;')"
          echo "apex_event_outbox rows in apex_control: $rows"
          [ "$rows" -ge 1 ] || { echo "no control command reached Postgres" >&2; exit 1; }

          # Wait for both replicas' fanout workers to drain the table. This is
          # the live half of the regression that only appeared on a real
          # Postgres-backed start: the sync postgres client blocks on its own
          # runtime for every query, which aborted the worker task on its first
          # tick while the process stayed up and kept accepting commands. A
          # container that looks healthy and delivers nothing is exactly what
          # this must not pass. The fanout tick is 5s.
          for attempt in $(seq 1 24); do
            pending="$(query "SELECT count(*) FROM apex_event_outbox WHERE state <> 'complete';")"
            [ "$pending" = 0 ] && break
            if [ "$attempt" = 24 ]; then
              echo "$pending row(s) never drained; the Postgres-backed fanout worker is not running" >&2
              docker compose $P logs --no-color --tail 80 control-plane-api-pg-a control-plane-api-pg-b >&2
              exit 1
            fi
            sleep 5
          done
          docker compose $P exec -T control-postgres \
            psql -U apex -d apex_control -c 'SELECT state, count(*), max(attempts) FROM apex_event_outbox GROUP BY state;'

          # Two fanout workers share one table. `attempts` is incremented by
          # the FOR UPDATE SKIP LOCKED claim, so a row claimed by both replicas
          # would show more attempts than the one round it actually took --
          # the double-delivery those claim leases exist to prevent. Asserted
          # only now that every row is complete, so this reads a settled table
          # rather than one mid-drain.
          attempts="$(query 'SELECT max(attempts) FROM apex_event_outbox;')"
          echo "max claim attempts across all rows: $attempts"
          [ "$attempts" = 1 ] \
            || { echo "expected every row claimed exactly once, got max(attempts)=$attempts" >&2; exit 1; }

          docker compose $P exec -T control-plane-api-pg-a sh -c \
            '[ -z "$(ls -A /var/lib/apex-control 2>/dev/null)" ] && [ ! -e ./data ]' \
            || { echo "a file outbox exists on the Postgres-backed replica" >&2; exit 1; }

      # The per-operator admission ceiling was a process-local HashMap, so N
      # replicas admitted N x the configured limit. `docker compose config`
      # cannot see that, and neither can an in-process test that shares one
      # store object between two services in one process. This runs two
      # containers, each holding its own mTLS Valkey connection under its own
      # ACL user, and the test below asserts the *combined* admission equals
      # the ceiling rather than twice it.
      #
      # This gate has already earned itself: the first run reported 2 x the
      # ceiling because the Valkey container was exiting on
      # `chown: .: Operation not permitted` under cap_drop:[ALL] -- and the
      # gateway kept serving happily on its process-local ceiling, so the only
      # symptom of a dead accelerator was the limit silently not applying.
      - name: Cross-replica admission ceiling (two replicas + Valkey)
        working-directory: deploy/compose
        timeout-minutes: 20
        run: |
          set -euo pipefail
          P="-p apex-gateway-ref-ci -f compose.gateway-ref.yaml -f compose.control-pg.yaml -f compose.control-valkey.yaml"
          docker compose $P up -d --force-recreate control-valkey control-plane-api-pg-a control-plane-api-pg-b
          for attempt in $(seq 1 60); do
            state="$(docker compose $P ps -a --format '{{.Name}} {{.State}}' | grep -E 'control-valkey|control-plane-api-pg' || true)"
            case "$state" in
              *exited*)
                echo "a container exited: $state" >&2
                docker compose $P logs --no-color control-valkey control-plane-api-pg-a control-plane-api-pg-b >&2
                exit 1
                ;;
            esac
            if (echo > /dev/tcp/127.0.0.1/18447) >/dev/null 2>&1 \
              && (echo > /dev/tcp/127.0.0.1/18448) >/dev/null 2>&1; then
              echo "both replicas serving with the shared accelerator (attempt $attempt)"
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose $P ps -a >&2
              docker compose $P logs --no-color --tail 120 control-valkey control-plane-api-pg-a control-plane-api-pg-b >&2
              echo "replicas never began serving" >&2
              exit 1
            fi
            sleep 2
          done
          # The startup line is the cheap half of the claim: a replica that
          # fell back to the process-local ceiling because its Valkey config
          # was refused would say so here, before any traffic is sent.
          docker compose $P logs --no-color control-plane-api-pg-a \
            | grep -q 'admission ceiling: shared (valkey)' \
            || { echo "replica A did not attach the shared admission store" >&2; exit 1; }

      - name: Live cross-replica admission tests
        working-directory: apps/control-plane-api
        timeout-minutes: 20
        env:
          APEX_CONTROL_LIVE_VALKEY: "1"
          # Must agree with compose.control-valkey.yaml's own default.
          APEX_CONTROL_ADMISSION_LIMIT: "8"
          APEX_CONTROL_LIVE_VALKEY_CONTAINER: apex-gateway-ref-ci-control-valkey-1
          APEX_CONTROL_LIVE_SECRETS: ${{ github.workspace }}/deploy/compose/live-mtls/secrets-host
        run: cargo test --test live_control_valkey -- --nocapture --test-threads=1

      # Same reasoning as every other live gate here, for the production
      # operator-credential path. `src/keycloak/tests.rs` covers the whole
      # rejection taxonomy offline, but a hand-rolled JWT mock and a
      # hand-rolled verifier can agree with each other while both disagree with
      # the identity provider -- and Keycloak publishes an RSA-OAEP `use: enc`
      # key in every realm's JWKS by default, which is precisely the material a
      # kid-only key lookup would happily verify signatures with.
      - name: Keycloak-backed operator credentials
        working-directory: deploy/compose
        timeout-minutes: 20
        run: |
          set -euo pipefail
          P="-p apex-gateway-ref-ci -f compose.gateway-ref.yaml -f compose.control-keycloak.yaml"
          # Reuses the apex-control-plane-api-ref:latest image the control
          # gateway step above already built.
          docker compose $P up -d --force-recreate keycloak control-plane-api-oidc
          for attempt in $(seq 1 90); do
            state="$(docker compose $P ps -a --format '{{.Name}} {{.State}}' | grep -E 'keycloak|control-plane-api-oidc' || true)"
            case "$state" in
              *exited*)
                echo "a container exited: $state" >&2
                docker compose $P logs --no-color keycloak control-plane-api-oidc >&2
                exit 1
                ;;
            esac
            if (echo > /dev/tcp/127.0.0.1/18449) >/dev/null 2>&1; then
              echo "the Keycloak-backed control gateway is serving (attempt $attempt)"
              break
            fi
            if [ "$attempt" = 90 ]; then
              docker compose $P ps -a >&2
              docker compose $P logs --no-color --tail 150 keycloak control-plane-api-oidc >&2
              echo "the Keycloak-backed control gateway never began serving" >&2
              exit 1
            fi
            sleep 2
          done
          # Proves the *deployed* selection path chose the Keycloak resolver,
          # before any token is presented. This container is configured with no
          # static table at all, so a wrong branch here means it authenticates
          # nobody -- and every rejection below would then pass for the wrong
          # reason.
          docker compose $P logs --no-color control-plane-api-oidc \
            | grep -q 'operator credentials: keycloak' \
            || { echo "the OIDC replica did not select the Keycloak resolver" >&2; exit 1; }

      - name: Live Keycloak operator credential tests
        working-directory: apps/control-plane-api
        timeout-minutes: 20
        env:
          APEX_CONTROL_LIVE_KEYCLOAK: "1"
          APEX_CONTROL_LIVE_SECRETS: ${{ github.workspace }}/deploy/compose/live-mtls/secrets-host
        run: cargo test --test live_control_keycloak -- --nocapture --test-threads=1

      - name: Adversarial corpus against the running container
        working-directory: apps/event-ingest
        timeout-minutes: 25
        env:
          APEX_ADVERSARIAL_GATEWAY: https://localhost:18445
          APEX_ADVERSARIAL_SECRETS: ${{ github.workspace }}/deploy/compose/live-mtls/secrets-host
          APEX_ADVERSARIAL_PKI: ${{ github.workspace }}/deploy/compose/live-mtls/adversarial
          APEX_ADVERSARIAL_CH_CONTAINER: apex-gateway-ref-ci-clickhouse-projection-1
          APEX_ADVERSARIAL_ARCHIVE_CONTAINER: apex-gateway-ref-ci-archive-provider-1
        run: |
          set -euo pipefail
          python "${GITHUB_WORKSPACE}/deploy/compose/e2e/generate_adversarial_pki.py" \
            --out "${GITHUB_WORKSPACE}/deploy/compose/live-mtls/adversarial"
          cargo test --test adversarial_ingest --features test-support -- --test-threads=1

      - name: Validate compose overlays (config only)
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          FP="$(tr -d '[:space:]' < live-mtls/secrets/ingest-http-client.sha256)"
          export APEX_BEARER_CERT_SHA256="$FP"
          export APEX_PROVIDER_CLIENT_CERT_SHA256="$FP"
          mkdir -p /tmp/apex-overlay-secrets
          : > /tmp/apex-overlay-secrets/azure-connection-string
          : > /tmp/apex-overlay-secrets/azure-account-key
          : > /tmp/apex-overlay-secrets/gcs-sa.json
          docker compose -f compose.gateway-ref.yaml config >/dev/null
          docker compose -f compose.gateway-ref.yaml -f compose.control-pg.yaml config >/dev/null
          docker compose -f compose.gateway-ref.yaml -f compose.control-pg.yaml -f compose.control-valkey.yaml config >/dev/null
          docker compose -f compose.gateway-ref.yaml -f compose.control-keycloak.yaml config >/dev/null
          AZURE_CONNECTION_STRING_FILE=/tmp/apex-overlay-secrets/azure-connection-string \
          AZURE_ACCOUNT_KEY_FILE=/tmp/apex-overlay-secrets/azure-account-key \
            docker compose -f compose.gateway-ref.yaml -f compose.azure.yaml config >/dev/null
          GCS_CREDENTIALS_FILE=/tmp/apex-overlay-secrets/gcs-sa.json \
          APEX_ARCHIVE_GCS_BUCKET=apex-ci-bucket \
            docker compose -f compose.gateway-ref.yaml -f compose.gcs.yaml config >/dev/null

      - name: Collect logs on failure
        if: failure()
        working-directory: deploy/compose/live-mtls
        run: |
          mkdir -p /tmp/apex-ci-logs
          docker compose -f compose.yaml ps -a > /tmp/apex-ci-logs/live-mtls-ps.txt 2>&1 || true
          docker compose -f compose.yaml logs --no-color --tail 200 > /tmp/apex-ci-logs/live-mtls-logs.txt 2>&1 || true
          docker compose -f ../compose.e2e.yaml ps -a > /tmp/apex-ci-logs/e2e-ps.txt 2>&1 || true
          docker compose -f ../compose.e2e.yaml logs --no-color --tail 100 > /tmp/apex-ci-logs/e2e-logs.txt 2>&1 || true
          # The gateway-ref profile's own init containers (gateway-secrets-init,
          # jetstream-init) exit before "Build and smoke-start" prints anything
          # beyond "didn't complete successfully: exit 1" -- without this, the
          # actual stderr that would explain why is never captured anywhere.
          docker compose -p apex-gateway-ref-ci -f ../compose.gateway-ref.yaml -f ../compose.control-pg.yaml -f ../compose.control-valkey.yaml -f ../compose.control-keycloak.yaml ps -a > /tmp/apex-ci-logs/gateway-ref-ps.txt 2>&1 || true
          docker compose -p apex-gateway-ref-ci -f ../compose.gateway-ref.yaml -f ../compose.control-pg.yaml -f ../compose.control-valkey.yaml -f ../compose.control-keycloak.yaml logs --no-color --tail 200 > /tmp/apex-ci-logs/gateway-ref-logs.txt 2>&1 || true
          docker ps -a > /tmp/apex-ci-logs/docker-ps.txt 2>&1 || true
          # Print to job log (public) so we can diagnose without admin log API.
          echo "===== live-mtls ps ====="
          cat /tmp/apex-ci-logs/live-mtls-ps.txt || true
          echo "===== live-mtls logs ====="
          cat /tmp/apex-ci-logs/live-mtls-logs.txt || true
          echo "===== gateway-ref ps ====="
          cat /tmp/apex-ci-logs/gateway-ref-ps.txt || true
          echo "===== gateway-ref logs ====="
          cat /tmp/apex-ci-logs/gateway-ref-logs.txt || true
          echo "===== docker ps ====="
          cat /tmp/apex-ci-logs/docker-ps.txt || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-mtls-compose-logs
          path: /tmp/apex-ci-logs/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          rm -f /tmp/apex-live-poll-*.jsonl || true
          docker compose -f deploy/compose/live-mtls/compose.yaml down --remove-orphans || true
          docker compose -f deploy/compose/compose.e2e.yaml down --remove-orphans || true
          docker compose -f deploy/compose/compose.gateway-ref.yaml down --remove-orphans || true
          docker compose -p apex-gateway-ref-ci -f deploy/compose/compose.gateway-ref.yaml -f deploy/compose/compose.control-pg.yaml -f deploy/compose/compose.control-valkey.yaml -f deploy/compose/compose.control-keycloak.yaml down -v --remove-orphans || true
