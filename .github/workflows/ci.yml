name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
      - name: Test
        env:
          TEMP: /tmp
          TMP: /tmp
        run: python -m pytest -q --cov=apex_sdk --cov-fail-under=95

  rust-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/event-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (core features)
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
        run: cargo test --locked --lib --features test-support -- --nocapture
      - name: Check PostgreSQL feature
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo check --locked --features "valkey,postgres"
      - name: Clippy
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo clippy --locked --all-targets --features test-support -- -D warnings

  signed-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
          python -m pytest tests/test_bundle_signing.py -q --no-cov
