name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            contracts/pnpm-lock.yaml
            packages/apex-contracts-ts/pnpm-lock.yaml
      - name: Install pinned contract tooling
        run: |
          pnpm --dir contracts install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/apex-contracts-ts install --frozen-lockfile --ignore-scripts
      - name: Verify generated contracts and compatibility
        run: |
          pnpm --dir contracts verify
          pnpm --dir contracts test
          node --test scripts/tests/verify-working-mcp-gateway.test.mjs
          node scripts/verify-working-mcp-gateway.mjs --list

  source-line-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the readability checker
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest
          python -m pytest -q scripts/test_check_source_line_limits.py
      - name: Enforce source line limits
        run: python3 scripts/check_source_line_limits.py

  mcp-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/mcp-gateway/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test, typecheck, and build
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

  operator-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/operator-ui/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck and build
        run: |
          pnpm typecheck
          pnpm build

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
      - name: Test
        env:
          TEMP: /tmp
          TMP: /tmp
        # Pin the coverage configuration explicitly so checked-in generated
        # protobuf/gRPC stubs stay outside the handwritten SDK gate even when
        # pytest-cov's config discovery changes.
        run: python -m pytest -q --cov=apex_sdk --cov-config=pyproject.toml --cov-fail-under=95

  rust-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/event-ingest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry, git sources, and workspace target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Test (all feature paths)
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
        run: cargo test --locked --lib --features "test-support,valkey,postgres" -- --nocapture
      - name: Check PostgreSQL feature
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo check --locked --features "valkey,postgres"
      - name: Clippy
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  rust-control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          # Disposable CI database; these credentials are lab-only.
          POSTGRES_USER: apex_journal_ci
          POSTGRES_PASSWORD: apex_journal_lab_only
          POSTGRES_DB: apex_proxy_journal
        ports:
          - "127.0.0.1:15432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U apex_journal_ci -d apex_proxy_journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/control-plane-api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry, git sources, and workspace target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Test (control gateway)
        env:
          # Required by journal/recovery tests; plaintext is loopback/lab-only.
          APEX_PROXY_JOURNAL_TEST_DATABASE_URL: "postgres://apex_journal_ci:apex_journal_lab_only@127.0.0.1:15432/apex_proxy_journal?sslmode=disable"
          APEX_ALLOW_POSTGRES_PLAINTEXT: "1"
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
        run: cargo test --locked --features "test-support,postgres,valkey" -- --nocapture
      - name: Test durable worker failure boundaries
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
        # Dependency unit tests are not run by the application test command.
        # These self-contained real-socket/TLS tests require no external database.
        run: cargo test -p apex-durability --locked --all-features --lib postgres_transport::worker -- --nocapture
      - name: Check PostgreSQL feature
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo check --locked --features postgres
      - name: Clippy
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  rust-agent-supervisor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-supervisor
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry, git sources, and workspace target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Test
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
        run: cargo test --locked
      - name: Clippy
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-sast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Rust crate carries its own Cargo.lock and deny.toml, so each
        # needs its own advisory/license/ban scan. Auditing only some leaves
        # the rest's dependency tree unscanned.
        crate: [apps/event-ingest, apps/control-plane-api, apps/agent-supervisor]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (dependency vulnerabilities)
        run: cargo audit
      - name: cargo deny (advisories, license policy, banned/duplicate crates, sources)
        run: cargo deny check

  python-sast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml
      - name: Install SAST tools
        run: python -m pip install --upgrade pip bandit pip-audit
      - name: Bandit (static analysis)
        run: bandit -r src --severity-level medium
      - name: pip-audit (dependency vulnerabilities)
        run: |
          python ../../scripts/collect_python_sdk_requirements.py pyproject.toml sast-requirements.txt
          pip-audit -r sast-requirements.txt

  lab-only-settings-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml
      - run: python3 scripts/check_lab_only_settings.py

  signed-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
          python -m pytest tests/test_bundle_signing.py -q --no-cov
