name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            contracts/pnpm-lock.yaml
            packages/apex-contracts-ts/pnpm-lock.yaml
      - name: Install pinned contract tooling
        run: |
          pnpm --dir contracts install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/apex-contracts-ts install --frozen-lockfile --ignore-scripts
      - name: Verify generated contracts and compatibility
        run: |
          pnpm --dir contracts verify
          pnpm --dir contracts test
          node --test scripts/tests/verify-working-mcp-gateway.test.mjs
          node --test scripts/tests/runtime-agent-ci.test.mjs
          node --test scripts/tests/mcp-proxy-bootstrap.test.mjs
          node --test scripts/tests/keycloak-ci-readiness.test.mjs
          node scripts/verify-working-mcp-gateway.mjs --list

  source-line-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the readability checker
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest
          python -m pytest -q scripts/test_check_source_line_limits.py
      - name: Enforce source line limits
        run: python3 scripts/check_source_line_limits.py

  mcp-gateway:
    needs: rust-control-plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/mcp-gateway/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the actual Rust-compiled runtime contract
        uses: actions/download-artifact@v8
        with:
          name: rust-runtime-contract
          path: ${{ runner.temp }}/runtime-contract
          digest-mismatch: error
      - name: Test, typecheck, and build
        env:
          APEX_RUNTIME_FIXTURE_PATH: ${{ runner.temp }}/runtime-contract/runtime-revision.json
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

  operator-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/operator-ui/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test, typecheck, and build
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
      - name: Test
        env:
          TEMP: /tmp
          TMP: /tmp
        # Pin the coverage configuration explicitly so checked-in generated
        # protobuf/gRPC stubs stay outside the handwritten SDK gate even when
        # pytest-cov's config discovery changes.
        run: python -m pytest -q --cov=apex_sdk --cov-config=pyproject.toml --cov-fail-under=95

  rust-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/event-ingest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry, git sources, and workspace target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Test (all feature paths)
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
        run: cargo test --locked --lib --features "test-support,valkey,postgres" -- --nocapture
      - name: Check PostgreSQL feature
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo check --locked --features "valkey,postgres"
      - name: Clippy
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  rust-control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          # Disposable CI database; these credentials are lab-only.
          POSTGRES_USER: apex_journal_ci
          POSTGRES_PASSWORD: apex_journal_lab_only
          POSTGRES_DB: apex_proxy_journal
        ports:
          - "127.0.0.1:15432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U apex_journal_ci -d apex_proxy_journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/control-plane-api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry, git sources, and workspace target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate disposable browser TLS fixtures
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check --no-input cryptography==49.0.0
          fixture_root="$(mktemp -d "${RUNNER_TEMP}/apex-browser-pki.XXXXXX")"
          python -B deploy/compose/live-mtls/generate_pki.py --out "${fixture_root}/trusted"
          python -B deploy/compose/live-mtls/generate_pki.py --out "${fixture_root}/untrusted"
          echo "APEX_BROWSER_TEST_PKI_DIR=${fixture_root}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/operator-ui/pnpm-lock.yaml
      - name: Cache the pinned acceptance browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-apex-chromium-playwright-1.62.0
      - name: Prepare the actual UI and browser acceptance driver
        working-directory: .
        run: |
          pnpm --dir apps/operator-ui install --frozen-lockfile --ignore-scripts
          pnpm --dir apps/operator-ui build
          pnpm --dir apps/operator-ui exec playwright install --with-deps --only-shell chromium
          node --test apps/operator-ui/scripts/browser-journey/*.test.mjs
      - name: Start real Keycloak browser fixture
        working-directory: .
        run: |
          node --test scripts/prepare-browser-keycloak.test.mjs
          docker pull quay.io/keycloak/keycloak@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
          node scripts/prepare-browser-keycloak.mjs start --port 18451 > "${RUNNER_TEMP}/apex-browser-keycloak.json"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const fixture = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'apex-browser-keycloak.json'), 'utf8'));
          if (fixture.ready !== true || !/^[a-f0-9]{32}$/.test(fixture.ownedId)) throw new Error('fixture did not become ready');
          appendFileSync(process.env.GITHUB_ENV,
            `APEX_BROWSER_KEYCLOAK_OWNED_ID=${fixture.ownedId}\nAPEX_BROWSER_KEYCLOAK_ISSUER=${fixture.env.APEX_BROWSER_KEYCLOAK_ISSUER}\n`);
          NODE
      - name: Start real refresh-race Keycloak backend
        working-directory: .
        run: |
          node scripts/prepare-browser-keycloak.mjs start --port 18462 --issuer-port 18461 > "${RUNNER_TEMP}/apex-browser-refresh-keycloak.json"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const fixture = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'apex-browser-refresh-keycloak.json'), 'utf8'));
          if (fixture.ready !== true || !/^[a-f0-9]{32}$/.test(fixture.ownedId)) throw new Error('refresh fixture did not become ready');
          appendFileSync(process.env.GITHUB_ENV,
            `APEX_BROWSER_REFRESH_OWNED_ID=${fixture.ownedId}\nAPEX_BROWSER_REFRESH_TEST_ISSUER=${fixture.env.APEX_BROWSER_KEYCLOAK_ISSUER}\n`);
          NODE
      - name: Build the cross-process runtime authority client probe
        working-directory: .
        run: |
          cargo build --locked -p apex-proxy-runtime-agent --example runtime_authority_probe --message-format=json > "${RUNNER_TEMP}/authority-client-build.jsonl"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync, statSync } from 'node:fs';
          import path from 'node:path';
          const messages = readFileSync(path.join(process.env.RUNNER_TEMP, 'authority-client-build.jsonl'), 'utf8')
            .trim().split('\n').map(line => JSON.parse(line));
          const artifacts = messages.filter(message => message.reason === 'compiler-artifact'
            && message.target?.name === 'runtime_authority_probe'
            && message.target.kind.includes('example') && message.executable);
          if (artifacts.length !== 1 || !statSync(artifacts[0].executable).isFile()) throw new Error('one actual agent probe executable required');
          appendFileSync(process.env.GITHUB_ENV, `APEX_RUNTIME_AUTHORITY_CLIENT_PROBE=${artifacts[0].executable}\n`);
          NODE
      - name: Test (control gateway)
        env:
          # Dedicated test-owned root; the exporter creates its UUID directory here.
          TMPDIR: ${{ runner.temp }}/rust-contract-export
          TEMP: ${{ runner.temp }}/rust-contract-export
          TMP: ${{ runner.temp }}/rust-contract-export
          # Required by journal/recovery tests; plaintext is loopback/lab-only.
          APEX_PROXY_JOURNAL_TEST_DATABASE_URL: "postgres://apex_journal_ci:apex_journal_lab_only@127.0.0.1:15432/apex_proxy_journal?sslmode=disable"
          APEX_BROWSER_SESSION_TEST_DATABASE_URL: "postgres://apex_journal_ci:apex_journal_lab_only@127.0.0.1:15432/apex_proxy_journal?sslmode=disable"
          APEX_ALLOW_POSTGRES_PLAINTEXT: "1"
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
        run: |
          mkdir "${TMPDIR}"
          cargo test --locked --features "test-support,postgres,valkey" -- --nocapture
      - name: Collect only the generated runtime contract
        working-directory: .
        run: |
          node --test scripts/tests/collect-runtime-fixture.test.mjs
          node scripts/collect-runtime-fixture.mjs --root "${RUNNER_TEMP}/rust-contract-export" --out "${RUNNER_TEMP}/runtime-revision.json"
      - name: Test runtime agent and shared boundaries
        env:
          APEX_RUNTIME_FIXTURE_PATH: ${{ runner.temp }}/runtime-revision.json
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
        run: |
          cargo test --locked -p apex-domain
          cargo test --locked -p apex-auth
          cargo test --locked -p apex-proxy-runtime-agent
          cargo clippy --locked -p apex-domain -p apex-auth -p apex-proxy-runtime-agent --all-targets -- -D warnings
      - name: Share the actual Rust export with the gateway tests
        uses: actions/upload-artifact@v7
        with:
          name: rust-runtime-contract
          path: ${{ runner.temp }}/runtime-revision.json
          if-no-files-found: error
          retention-days: 1
      - name: Test durable worker failure boundaries
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
        # Dependency unit tests are not run by the application test command.
        # These self-contained real-socket/TLS tests require no external database.
        run: cargo test -p apex-durability --locked --all-features --lib postgres_transport::worker -- --nocapture
      - name: Verify integer microsecond clock primitive
        run: |
          cargo test -p apex-telemetry --locked
          cargo clippy -p apex-telemetry --locked --all-targets -- -D warnings
      - name: Check PostgreSQL feature
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo check --locked --features postgres
      - name: Clippy
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Remove only the owned refresh-race Keycloak backend
        if: ${{ always() && env.APEX_BROWSER_REFRESH_OWNED_ID != '' }}
        working-directory: .
        run: node scripts/prepare-browser-keycloak.mjs stop --owned-id "${APEX_BROWSER_REFRESH_OWNED_ID}"
      - name: Remove only the owned Keycloak fixture
        if: ${{ always() && env.APEX_BROWSER_KEYCLOAK_OWNED_ID != '' }}
        working-directory: .
        run: node scripts/prepare-browser-keycloak.mjs stop --owned-id "${APEX_BROWSER_KEYCLOAK_OWNED_ID}"

  rust-agent-supervisor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-supervisor
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry, git sources, and workspace target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Test
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
        run: cargo test --locked
      - name: Clippy
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-sast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Rust crate carries its own Cargo.lock and deny.toml, so each
        # needs its own advisory/license/ban scan. Auditing only some leaves
        # the rest's dependency tree unscanned.
        crate: [apps/event-ingest, apps/control-plane-api, apps/agent-supervisor]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (dependency vulnerabilities)
        run: cargo audit
      - name: cargo deny (advisories, license policy, banned/duplicate crates, sources)
        run: cargo deny check

  python-sast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml
      - name: Install SAST tools
        run: python -m pip install --upgrade pip bandit pip-audit
      - name: Bandit (static analysis)
        run: bandit -r src --severity-level medium
      - name: pip-audit (dependency vulnerabilities)
        run: |
          python ../../scripts/collect_python_sdk_requirements.py pyproject.toml sast-requirements.txt
          pip-audit -r sast-requirements.txt

  lab-only-settings-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml
      - run: python3 scripts/check_lab_only_settings.py

  signed-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
          python -m pytest tests/test_bundle_signing.py -q --no-cov
