name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" 2>/dev/null || python -m pip install -e .
          python -m pip install pytest pytest-cov cryptography
      - name: Test
        env:
          TEMP: /tmp
          TMP: /tmp
        run: python -m pytest -q --cov=apex_sdk --cov-fail-under=95

  rust-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/event-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (core features)
        run: cargo test --lib --features "test-support,valkey,postgres"
      - name: Clippy
        run: cargo clippy --all-targets --features "test-support,valkey,postgres" -- -D warnings

  signed-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip cryptography pytest
          PYTHONPATH=src python -m pytest tests/test_bundle_signing.py -q
