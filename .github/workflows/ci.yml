name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
      - name: Test
        env:
          TEMP: /tmp
          TMP: /tmp
        run: python -m pytest -q --cov=apex_sdk --cov-fail-under=95

  rust-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/event-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test (core features)
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
        run: cargo test --locked --lib --features test-support -- --nocapture
      - name: Check PostgreSQL feature
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo check --locked --features "valkey,postgres"
      # The load harness is not built by `--lib` above, is excluded from a
      # default `cargo build` by `required-features`, and never enters the
      # runtime image, so nothing else here would notice it stop compiling.
      # The crate is already built in this job, so this costs seconds.
      - name: Check the load-baseline harness
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo check --locked --bin apex-load-baseline --features test-support
      - name: Clippy
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        # Lint the library only. Do not use -D warnings until CI clippy matches local
        # (dtolnay stable can differ slightly across minutes). Still surface findings.
        run: |
          set -eu
          cargo clippy --locked --lib --features test-support -- -W clippy::all 2>&1 | tee /tmp/clippy.log
          # Fail only on hard compiler/clippy errors, not style warnings.
          if grep -E '^error(\[|:)' /tmp/clippy.log; then
            exit 1
          fi

  rust-control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane-api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test (control gateway)
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
        run: cargo test --locked --features test-support -- --nocapture
      - name: Check PostgreSQL feature
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo check --locked --features postgres
      - name: Clippy
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        # Mirrors the rust-ingest job: surface every finding, but fail only on
        # hard compiler/clippy errors, because CI's stable clippy can drift
        # slightly from the locally pinned toolchain.
        run: |
          set -eu
          cargo clippy --locked --all-targets --features test-support -- -W clippy::all 2>&1 | tee /tmp/clippy-control.log
          if grep -E '^error(\[|:)' /tmp/clippy-control.log; then
            exit 1
          fi

  rust-sast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both Rust services carry their own Cargo.lock and deny.toml, so both
        # need their own advisory/license/ban scan. Auditing only one leaves
        # the other's dependency tree unscanned.
        crate: [apps/event-ingest, apps/control-plane-api]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (dependency vulnerabilities)
        run: cargo audit
      - name: cargo deny (advisories, license policy, banned/duplicate crates, sources)
        run: cargo deny check

  python-sast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SAST tools
        run: python -m pip install --upgrade pip bandit pip-audit
      - name: Bandit (static analysis)
        run: bandit -r src --severity-level medium
      - name: pip-audit (dependency vulnerabilities)
        run: |
          python ../../scripts/collect_python_sdk_requirements.py pyproject.toml sast-requirements.txt
          pip-audit -r sast-requirements.txt

  lab-only-settings-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_lab_only_settings.py

  signed-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
          python -m pytest tests/test_bundle_signing.py -q --no-cov
