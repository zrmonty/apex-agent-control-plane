# Overlay: run ingest-gateway against reference providers + NATS from live-mTLS PKI.
#
# Usage (from deploy/compose after generating live-mtls secrets):
#
#   cd live-mtls && python generate_pki.py && python render_configs.py && cd ..
#   docker compose -f compose.gateway-ref.yaml --project-directory live-mtls up -d --build
#
# Or: deploy/compose/gateway-ref/run.ps1
#
# This is a local/CI reference path — not a substitute for digest-pinned production images.

name: apex-gateway-ref

# Shared by ingest-gateway and gateway-secrets-init so both resolve to one
# image tag and BuildKit builds it exactly once.
x-gateway-build: &gateway-build
  image: apex-event-ingest-ref:latest
  build:
    # Repository root: build.rs compiles contracts/proto/..., which is
    # outside the crate directory and therefore outside a narrower context.
    context: ../..
    dockerfile: apps/event-ingest/Dockerfile
    args:
      BUILD_IMAGE: ${GATEWAY_BUILD_IMAGE:-rust@sha256:77fac8b98f9f46062bb680b6d25d5bcaabfc400143952ebc572e924bcbedc3fa}
      RUNTIME_IMAGE: ${GATEWAY_RUNTIME_IMAGE:-debian@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818}
      CARGO_FEATURES: ${GATEWAY_CARGO_FEATURES:-}

services:
  jetstream:
    image: nats@sha256:dd5152d5de4ce2a22b970cc553dd5b45ac9533bdddc440a79f970ac489ce2fa5
    command: ["--config", "/run/secrets/nats_config"]
    networks: [gateway-ref]
    secrets:
      - source: nats_config
        target: nats_config
      - source: nats_server_cert
        target: nats_server_cert
      - source: nats_server_key
        target: nats_server_key
      - source: ca
        target: nats_client_ca
    tmpfs: [/tmp, /data]

  # Binds a stream to `apex.events.>`.
  #
  # Without this, JetStream has no stream for the gateway's publish subject and
  # every valid event is answered PUBLISH_FAILED / Unavailable. The gateway
  # fails closed (nothing is acknowledged that did not land), but the stack
  # cannot accept a single event. The only place a stream was ever created was
  # `tests/live_mtls.rs`, as a side effect of running that test.
  jetstream-init:
    image: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    working_dir: /app
    command:
      [
        "python",
        "/app/gateway-ref/provision_jetstream.py",
        "--host",
        "jetstream",
        "--port",
        "4222",
        "--ca",
        "/run/secrets/ca",
        "--cert",
        "/run/secrets/ingest_nats_client_cert",
        "--key",
        "/run/secrets/ingest_nats_client_key",
        "--username-file",
        "/run/secrets/nats_username",
        "--password-file",
        "/run/secrets/nats_password",
      ]
    volumes:
      - ./gateway-ref:/app/gateway-ref:ro
    depends_on:
      - jetstream
    networks: [gateway-ref]
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    secrets:
      - ca
      - ingest_nats_client_cert
      - source: ingest_nats_client_key
        target: ingest_nats_client_key
      - nats_username
      - nats_password

  clickhouse-projection:
    image: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    working_dir: /app
    environment:
      PYTHONPATH: /app
      APEX_PROVIDER_CLIENT_CERT_SHA256: ${APEX_PROVIDER_CLIENT_CERT_SHA256:-}
      APEX_PROVIDER_ALLOW_UNPINNED_CLIENT: "1"
    command:
      [
        "python",
        "-m",
        "apex_reference_providers",
        "clickhouse_projection",
        "--bind",
        "0.0.0.0",
        "--port",
        "8443",
        "--cert",
        "/run/secrets/server_cert",
        "--key",
        "/run/secrets/server_key",
        "--client-ca",
        "/run/secrets/ca",
        "--data-dir",
        "/var/lib/apex",
      ]
    volumes:
      - ../../apps/reference-providers/apex_reference_providers:/app/apex_reference_providers:ro
    tmpfs: [/var/lib/apex]
    networks: [gateway-ref]
    secrets:
      - source: clickhouse_server_cert
        target: server_cert
      - source: clickhouse_server_key
        target: server_key
      - source: ca
        target: ca

  archive-provider:
    image: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    working_dir: /app
    environment:
      PYTHONPATH: /app
      APEX_ARCHIVE_BACKEND: local
      APEX_PROVIDER_CLIENT_CERT_SHA256: ${APEX_PROVIDER_CLIENT_CERT_SHA256:-}
      APEX_PROVIDER_ALLOW_UNPINNED_CLIENT: "1"
    command:
      [
        "python",
        "-m",
        "apex_reference_providers",
        "archive_provider",
        "--bind",
        "0.0.0.0",
        "--port",
        "8443",
        "--cert",
        "/run/secrets/server_cert",
        "--key",
        "/run/secrets/server_key",
        "--client-ca",
        "/run/secrets/ca",
        "--data-dir",
        "/var/lib/apex",
        "--backend",
        "local",
      ]
    volumes:
      - ../../apps/reference-providers/apex_reference_providers:/app/apex_reference_providers:ro
    tmpfs: [/var/lib/apex]
    networks: [gateway-ref]
    secrets:
      - source: archive_server_cert
        target: server_cert
      - source: archive_server_key
        target: server_key
      - source: ca
        target: ca

  # Restages secret material at 0600 owned by the gateway uid.
  #
  # Compose ignores `mode:` on file-based secrets: it bind-mounts the host file
  # and the host's mode wins (0444 on Linux, 0777 through a Docker Desktop
  # Windows bind). The gateway refuses private key material with any group or
  # other bit set, so mounting /run/secrets directly makes it exit at startup
  # with INVALID_NATS_CONFIGURATION, every time.
  #
  # This runs as the same unprivileged uid as the gateway and needs no
  # capabilities: /var/lib/apex-secrets is created in the image owned by 10001,
  # so a fresh named volume inherits that ownership. The gateway's own
  # permission check is unchanged and still fails closed if this step is
  # skipped or fails.
  gateway-secrets-init:
    <<: *gateway-build
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        for name in ca ingest_nats_client_cert ingest_nats_client_key \
                    nats_username nats_password ingest_http_client_cert \
                    ingest_http_client_key ingest_bearer_token \
                    gateway_server_cert gateway_server_key; do
          test -f "/run/secrets/$$name" || { echo "gateway-secrets-init: missing /run/secrets/$$name" >&2; exit 1; }
          cp "/run/secrets/$$name" "/var/lib/apex-secrets/$$name"
          chmod 0600 "/var/lib/apex-secrets/$$name"
        done
        # Fail closed rather than hand the gateway material it will reject.
        for staged in /var/lib/apex-secrets/*; do
          mode="$$(stat -c '%a' "$$staged")"
          test "$$mode" = "600" || { echo "gateway-secrets-init: $$staged is mode $$mode, expected 600" >&2; exit 1; }
        done
        echo "gateway-secrets-init: staged $$(ls -1 /var/lib/apex-secrets | wc -l) secrets at 0600"
    networks: [gateway-ref]
    volumes:
      - gateway-secrets:/var/lib/apex-secrets
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: "no"
    secrets:
      - ca
      - ingest_nats_client_cert
      - source: ingest_nats_client_key
        target: ingest_nats_client_key
      - nats_username
      - nats_password
      - ingest_http_client_cert
      - source: ingest_http_client_key
        target: ingest_http_client_key
      - ingest_bearer_token
      - gateway_server_cert
      - source: gateway_server_key
        target: gateway_server_key

  ingest-gateway:
    <<: *gateway-build
    environment:
      APEX_TRUSTED_SECRET_BASE: /var/lib/apex-secrets
      APEX_LISTEN_ADDR: 0.0.0.0:8443
      APEX_NATS_URL: tls://jetstream:4222
      APEX_NATS_CA_FILE: /var/lib/apex-secrets/ca
      APEX_NATS_CLIENT_CERT_FILE: /var/lib/apex-secrets/ingest_nats_client_cert
      APEX_NATS_CLIENT_KEY_FILE: /var/lib/apex-secrets/ingest_nats_client_key
      APEX_NATS_USERNAME_FILE: /var/lib/apex-secrets/nats_username
      APEX_NATS_PASSWORD_FILE: /var/lib/apex-secrets/nats_password
      APEX_CLICKHOUSE_ENDPOINT: https://clickhouse-projection:8443/v1/events
      APEX_ALLOW_PRIVATE_SINK_DESTINATIONS: "1"
      APEX_PRIVATE_SINK_HOSTS: clickhouse-projection,archive-provider
      APEX_CLICKHOUSE_CA_FILE: /var/lib/apex-secrets/ca
      APEX_CLICKHOUSE_CLIENT_CERT_FILE: /var/lib/apex-secrets/ingest_http_client_cert
      APEX_CLICKHOUSE_CLIENT_KEY_FILE: /var/lib/apex-secrets/ingest_http_client_key
      APEX_ARCHIVE_ENDPOINT: https://archive-provider:8443/v1/events
      APEX_ARCHIVE_CA_FILE: /var/lib/apex-secrets/ca
      APEX_ARCHIVE_CLIENT_CERT_FILE: /var/lib/apex-secrets/ingest_http_client_cert
      APEX_ARCHIVE_CLIENT_KEY_FILE: /var/lib/apex-secrets/ingest_http_client_key
      APEX_BEARER_TOKEN_FILE: /var/lib/apex-secrets/ingest_bearer_token
      APEX_FILE_BEARER_MODE: single-agent-staging
      APEX_BEARER_AGENT_ID: ${APEX_BEARER_AGENT_ID:-reference-agent}
      APEX_BEARER_CERT_SHA256: ${APEX_BEARER_CERT_SHA256:-}
      APEX_ALLOWED_SCOPES: ${APEX_ALLOWED_SCOPES:-acme/prod}
      APEX_OUTBOX_FILE: /var/lib/apex/outbox.jsonl
      APEX_OUTBOX_BASE: /var/lib/apex
      APEX_IDEMPOTENCY_FILE: /var/lib/apex/idempotency.jsonl
      APEX_IDEMPOTENCY_BASE: /var/lib/apex
      APEX_GATEWAY_SERVER_CERT_FILE: /var/lib/apex-secrets/gateway_server_cert
      APEX_GATEWAY_SERVER_KEY_FILE: /var/lib/apex-secrets/gateway_server_key
      APEX_GATEWAY_CLIENT_CA_FILE: /var/lib/apex-secrets/ca
      APEX_RETRY_ATTEMPTS: "3"
      APEX_IDEMPOTENCY_CAPACITY: "50000"
    depends_on:
      jetstream:
        condition: service_started
      jetstream-init:
        condition: service_completed_successfully
      clickhouse-projection:
        condition: service_started
      archive-provider:
        condition: service_started
      gateway-secrets-init:
        condition: service_completed_successfully
    networks: [gateway-ref]
    ports:
      - "${APEX_INGEST_BIND:-127.0.0.1}:${APEX_INGEST_PORT:-18445}:8443"
    volumes:
      - gateway-data:/var/lib/apex
      # Read-only: the gateway reads staged material and never rewrites it.
      - gateway-secrets:/var/lib/apex-secrets:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  gateway-ref:

volumes:
  gateway-data:
  gateway-secrets:

secrets:
  ca:
    file: ./live-mtls/secrets/ca.pem
  nats_config:
    file: ./live-mtls/secrets/nats.conf
  nats_server_cert:
    file: ./live-mtls/secrets/nats-server.pem
  nats_server_key:
    file: ./live-mtls/secrets/nats-server.key
  nats_username:
    file: ./live-mtls/secrets/nats-username
  nats_password:
    file: ./live-mtls/secrets/nats-password
  clickhouse_server_cert:
    file: ./live-mtls/secrets/clickhouse-projection-server.pem
  clickhouse_server_key:
    file: ./live-mtls/secrets/clickhouse-projection-server.key
  archive_server_cert:
    file: ./live-mtls/secrets/archive-provider-server.pem
  archive_server_key:
    file: ./live-mtls/secrets/archive-provider-server.key
  ingest_nats_client_cert:
    file: ./live-mtls/secrets/ingest-nats-client.pem
  ingest_nats_client_key:
    file: ./live-mtls/secrets/ingest-nats-client.key
  ingest_http_client_cert:
    file: ./live-mtls/secrets/ingest-http-client.pem
  ingest_http_client_key:
    file: ./live-mtls/secrets/ingest-http-client.key
  # Reuse CA as gateway server material for local reference only.
  gateway_server_cert:
    file: ./live-mtls/secrets/nats-server.pem
  gateway_server_key:
    file: ./live-mtls/secrets/nats-server.key
  ingest_bearer_token:
    file: ./live-mtls/secrets/ingest-bearer-token
