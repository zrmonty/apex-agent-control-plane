# Local-only live mTLS handshake stack.
# Not for production. Uses short-lived generated certs under ./secrets.
#
# Start: from this directory after generate_pki.py + render_configs.py
#   docker compose -f compose.yaml up -d --build
#
# Note: Docker Compose on Linux ignores secret mode/uid/gid. Lab private keys
# must be world-readable in ./secrets (generate_pki.py sets 0644 for lab).
# Official nats images run as non-root unless user is forced to 0:0.

name: apex-live-mtls

services:
  valkey:
    # 8.0.9, not the floating "8.0" tag: any 8.0.x below 8.0.7 carries several
    # CVEs (DoS, info disclosure), one at CVSS 8.8.
    image: valkey/valkey:8.0.9
    user: "0:0"
    entrypoint: ["valkey-server"]
    command: ["/run/secrets/valkey_config"]
    ports:
      - "16379:6379"
    networks: [live-mtls]
    secrets:
      - source: valkey_config
        target: valkey_config
      - source: valkey_acl
        target: valkey_acl
      - source: valkey_server_cert
        target: valkey_server_cert
      - source: valkey_server_key
        target: valkey_server_key
      - source: ca
        target: valkey_client_ca
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /data]

  jetstream:
    # 2.12, not 2.10: 2.10.29 is affected by CVE-2026-27889 (pre-auth crash via
    # a malformed WebSocket frame; not enabled by this config, but no reason
    # to run the vulnerable code path at rest) and CVE-2026-33247.
    image: nats:2.12
    # nats image defaults to non-root; force root so mounted lab keys are readable.
    user: "0:0"
    command: ["--config", "/run/secrets/nats_config"]
    ports:
      - "14222:4222"
    networks: [live-mtls]
    secrets:
      - source: nats_config
        target: nats_config
      - source: nats_server_cert
        target: nats_server_cert
      - source: nats_server_key
        target: nats_server_key
      - source: ca
        target: nats_client_ca
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /data]

  clickhouse-projection:
    build:
      context: ../../../apps/reference-providers
      dockerfile: Dockerfile
    image: apex-reference-providers:live-mtls
    user: "0:0"
    working_dir: /app
    command:
      [
        "clickhouse_projection",
        "--bind",
        "0.0.0.0",
        "--port",
        "8443",
        "--cert",
        "/run/secrets/clickhouse_server_cert",
        "--key",
        "/run/secrets/clickhouse_server_key",
        "--client-ca",
        "/run/secrets/ca",
        "--data-dir",
        "/var/lib/apex",
      ]
    ports:
      - "18443:8443"
    tmpfs: [/var/lib/apex]
    environment:
      PYTHONPATH: /app
      APEX_PROVIDER_CLIENT_CERT_SHA256: ${APEX_PROVIDER_CLIENT_CERT_SHA256:-}
    networks: [live-mtls]
    secrets:
      - source: clickhouse_server_cert
        target: clickhouse_server_cert
      - source: clickhouse_server_key
        target: clickhouse_server_key
      - source: ca
        target: ca
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8443),2); s.close()\"",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  archive-provider:
    build:
      context: ../../../apps/reference-providers
      dockerfile: Dockerfile
    image: apex-reference-providers:live-mtls
    user: "0:0"
    working_dir: /app
    command:
      [
        "archive_provider",
        "--bind",
        "0.0.0.0",
        "--port",
        "8444",
        "--cert",
        "/run/secrets/archive_server_cert",
        "--key",
        "/run/secrets/archive_server_key",
        "--client-ca",
        "/run/secrets/ca",
        "--data-dir",
        "/var/lib/apex",
      ]
    ports:
      - "18444:8444"
    tmpfs: [/var/lib/apex]
    environment:
      PYTHONPATH: /app
      APEX_PROVIDER_CLIENT_CERT_SHA256: ${APEX_PROVIDER_CLIENT_CERT_SHA256:-}
    networks: [live-mtls]
    secrets:
      - source: archive_server_cert
        target: archive_server_cert
      - source: archive_server_key
        target: archive_server_key
      - source: ca
        target: ca
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8444),2); s.close()\"",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

networks:
  live-mtls:
    driver: bridge

secrets:
  ca:
    file: ./secrets/ca.pem
  valkey_config:
    file: ./secrets/valkey.conf
  valkey_acl:
    file: ./secrets/valkey.acl
  valkey_server_cert:
    file: ./secrets/valkey-server.pem
  valkey_server_key:
    file: ./secrets/valkey-server.key
  nats_config:
    file: ./secrets/nats.conf
  nats_server_cert:
    file: ./secrets/nats-server.pem
  nats_server_key:
    file: ./secrets/nats-server.key
  clickhouse_server_cert:
    file: ./secrets/clickhouse-projection-server.pem
  clickhouse_server_key:
    file: ./secrets/clickhouse-projection-server.key
  archive_server_cert:
    file: ./secrets/archive-provider-server.pem
  archive_server_key:
    file: ./secrets/archive-provider-server.key
