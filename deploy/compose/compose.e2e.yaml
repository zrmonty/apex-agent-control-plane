# Phase 0 durable-path E2E overlay (local / CI with Docker).
#
# Starts NATS JetStream, reference ClickHouse/archive providers, optional Postgres,
# and reuses live-mTLS secrets generation.
#
# Usage (from deploy/compose/live-mtls after PKI generation):
#   docker compose -f ../compose.e2e.yaml --project-directory . up -d
#
# Prefer: deploy/compose/e2e/run.ps1

name: apex-e2e

services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex_e2e_local_only
      POSTGRES_DB: apex
    ports:
      - "127.0.0.1:15432:5432"
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 3s
      timeout: 3s
      retries: 20

  jetstream:
    image: nats@sha256:dd5152d5de4ce2a22b970cc553dd5b45ac9533bdddc440a79f970ac489ce2fa5
    command: ["--config", "/run/secrets/nats_config"]
    ports:
      - "127.0.0.1:15222:4222"
    networks: [e2e]
    secrets:
      - source: nats_config
        target: nats_config
      - source: nats_server_cert
        target: nats_server_cert
      - source: nats_server_key
        target: nats_server_key
      - source: ca
        target: nats_client_ca
    tmpfs: [/tmp, /data]

  clickhouse-projection:
    image: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    working_dir: /app
    environment:
      PYTHONPATH: /app
      # Lab/CI: optional. Empty accepts any CA-trusted client in reference providers.
      APEX_PROVIDER_CLIENT_CERT_SHA256: ${APEX_PROVIDER_CLIENT_CERT_SHA256:-}
      APEX_PROVIDER_ALLOW_UNPINNED_CLIENT: "1"
    command:
      [
        "python",
        "-m",
        "apex_reference_providers",
        "clickhouse_projection",
        "--bind",
        "0.0.0.0",
        "--port",
        "8443",
        "--cert",
        "/run/secrets/server_cert",
        "--key",
        "/run/secrets/server_key",
        "--client-ca",
        "/run/secrets/ca",
        "--data-dir",
        "/var/lib/apex",
      ]
    ports:
      - "127.0.0.1:19443:8443"
    volumes:
      - ../../apps/reference-providers/apex_reference_providers:/app/apex_reference_providers:ro
    tmpfs: [/var/lib/apex]
    networks: [e2e]
    secrets:
      - source: clickhouse_server_cert
        target: server_cert
      - source: clickhouse_server_key
        target: server_key
      - source: ca
        target: ca

  archive-provider:
    image: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    working_dir: /app
    environment:
      PYTHONPATH: /app
      # Lab/CI: optional. Empty accepts any CA-trusted client in reference providers.
      APEX_PROVIDER_CLIENT_CERT_SHA256: ${APEX_PROVIDER_CLIENT_CERT_SHA256:-}
      APEX_PROVIDER_ALLOW_UNPINNED_CLIENT: "1"
    command:
      [
        "python",
        "-m",
        "apex_reference_providers",
        "archive_provider",
        "--bind",
        "0.0.0.0",
        "--port",
        "8444",
        "--cert",
        "/run/secrets/server_cert",
        "--key",
        "/run/secrets/server_key",
        "--client-ca",
        "/run/secrets/ca",
        "--data-dir",
        "/var/lib/apex",
      ]
    ports:
      - "127.0.0.1:19444:8444"
    volumes:
      - ../../apps/reference-providers/apex_reference_providers:/app/apex_reference_providers:ro
    tmpfs: [/var/lib/apex]
    networks: [e2e]
    secrets:
      - source: archive_server_cert
        target: server_cert
      - source: archive_server_key
        target: server_key
      - source: ca
        target: ca

  # Chainguard's minio image runs as non-root (uid 65532) with no shell/chown
  # available inside it, and a fresh named volume is created root-owned --
  # so /data must be handed to that uid before minio's own entrypoint starts.
  minio-data-init:
    image: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    user: "0:0"
    entrypoint: ["chown", "-R", "65532:65532", "/data"]
    networks: [e2e]
    volumes:
      - minio-data:/data

  minio:
    # Chainguard's build, not upstream minio/minio: MinIO stopped publishing
    # free community-edition Docker images in October 2025 (source-only
    # distribution now), so the last free upstream image is permanently
    # stuck without security patches -- it's missing the fix for
    # CVE-2025-62506 (privilege escalation) and everything disclosed since.
    # Chainguard rebuilds this same MinIO source daily with current patches.
    # Same entrypoint/command/env shape as upstream; only the base image and
    # non-root default user differ.
    image: chainguard/minio@sha256:5f2b82fe2edccafed7902f423f171ae5e6b8b363fae72441c0e0e4289dc45555
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: apexminio
      MINIO_ROOT_PASSWORD: apexminio_e2e_local_only
    depends_on:
      minio-data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19000:9000"
    networks: [e2e]
    volumes:
      - minio-data:/data

networks:
  e2e:

volumes:
  minio-data:

secrets:
  ca:
    file: ./live-mtls/secrets/ca.pem
  nats_config:
    file: ./live-mtls/secrets/nats.conf
  nats_server_cert:
    file: ./live-mtls/secrets/nats-server.pem
  nats_server_key:
    file: ./live-mtls/secrets/nats-server.key
  clickhouse_server_cert:
    file: ./live-mtls/secrets/clickhouse-projection-server.pem
  clickhouse_server_key:
    file: ./live-mtls/secrets/clickhouse-projection-server.key
  archive_server_cert:
    file: ./live-mtls/secrets/archive-provider-server.pem
  archive_server_key:
    file: ./live-mtls/secrets/archive-provider-server.key
