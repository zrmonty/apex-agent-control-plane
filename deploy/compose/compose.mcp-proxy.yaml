# Bootstrap/startup-refusal fixture for a managed MCP proxy.
#
# The legacy revision-config fixture below is not generated runtime config.
# This overlay is not a deployable-ready profile or release/readiness proof.
# The proxy retains its internal fixture network, no host ports, no Docker
# socket, no host mounts, and no raw secret values. The control plane alone
# decides which revision is provisioned in a real deployment.

services:
  mcp-proxy-portfolio:
    image: apex-mcp-gateway:runtime-baseline
    build:
      context: ../..
      dockerfile: apps/mcp-gateway/Dockerfile
    environment:
      APEX_MCP_PROFILE: managed
      APEX_MCP_GOVERNANCE_MODE: live
      APEX_MCP_PROXY_REVISION_CONFIG_FILE: /run/secrets/proxy_revision_config
      APEX_MCP_PRINCIPAL: spiffe://apex/agent/mcp-proxy-runtime
      APEX_MCP_AGENT_ID: mcp-proxy-runtime
      APEX_MCP_WORKSPACE_ID: apex
      APEX_MCP_NAMESPACE_ID: mcp-proxy
      APEX_MCP_TRACE_ID: mcp-proxy-runtime
    user: "10001:10001"
    stdin_open: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    cpus: "0.5"
    mem_limit: 268m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks: [mcp-proxy-egress]
    secrets:
      - proxy_revision_config
    # No real authenticated health probe exists yet; disabling is not readiness.
    healthcheck:
      disable: true

  mcp-proxy-test-upstream:
    image: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    command: ["python", "/opt/mcp-proxy-test/upstream.py"]
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./mcp-proxy-test:/opt/mcp-proxy-test:ro
    networks: [mcp-proxy-egress]

networks:
  mcp-proxy-egress:
    internal: true

secrets:
  proxy_revision_config:
    file: ./mcp-proxy-test/revision-config.json
