name: apex-phase0

# OPERATOR WARNING -- `mode:` on the secrets below does NOT do what it looks
# like it does.
#
# Compose ignores `mode`, `uid`, and `gid` for *file-based* secrets outside
# Swarm: it bind-mounts the host file, so the host file's own mode and owner are
# what land in the container. The `mode: "0400"` entries throughout this file
# are therefore documentation of intent, not an enforced control. This
# repository's own CI works around it by chmod-ing the generated lab keys to
# 0644, which guarantees the opposite of the stated intent.
#
# This matters because the gateway refuses private key material with any group
# or other permission bit set. Mounted at 0444 (Compose's usual result) or 0777
# (a Docker Desktop Windows bind), it exits at startup with
# INVALID_NATS_CONFIGURATION and never binds a listener.
#
# What an operator must actually do on the host, for every file referenced by a
# `secrets:` entry marked `mode: "0400"` below:
#
#     chown <uid>:<uid> <file>     # the uid of the container that reads it
#     chmod 0400 <file>
#
# The two services run as different uids on purpose (ADR-0006: independent
# trust boundaries, visible at the OS layer and not only in application code):
#
#     10001   ingest-gateway       (apps/event-ingest/Dockerfile)
#     10002   control-plane-api    (apps/control-plane-api/Dockerfile)
#
# So control_server_key and control_operator_tokens must be owned by 10002,
# and everything the ingest gateway reads by 10001. A file chowned to the
# wrong one of those two is unreadable to the container that needs it, and the
# process exits at startup rather than serving.
#
# `deploy/compose/preflight.sh` / `preflight.ps1` check for this before you
# start the stack. `compose.gateway-ref.yaml` takes the other approach -- an
# unprivileged init container restages the material at 0600 into a volume --
# which is the better pattern if you cannot control host ownership.

services:
  ingest-gateway:
    image: ${APEX_INGEST_IMAGE:?set APEX_INGEST_IMAGE to an approved, digest-pinned image}
    command: ["/usr/local/bin/apex-event-ingest"]
    environment:
      APEX_TRUSTED_SECRET_BASE: /run/secrets
      APEX_LISTEN_ADDR: 0.0.0.0:8443
      APEX_NATS_URL: tls://jetstream:4222
      APEX_NATS_CA_FILE: /run/secrets/nats_client_ca
      APEX_NATS_CLIENT_CERT_FILE: /run/secrets/ingest_nats_client_cert
      APEX_NATS_CLIENT_KEY_FILE: /run/secrets/ingest_nats_client_key
      APEX_NATS_USERNAME_FILE: /run/secrets/nats_username
      APEX_NATS_PASSWORD_FILE: /run/secrets/nats_password
      APEX_CLICKHOUSE_ENDPOINT: ${APEX_CLICKHOUSE_ENDPOINT:-https://clickhouse-projection:8443/v1/events}
      APEX_ALLOW_PRIVATE_SINK_DESTINATIONS: ${APEX_ALLOW_PRIVATE_SINK_DESTINATIONS:?set to 1 only if APEX_PRIVATE_SINK_HOSTS is narrowed to this profile's own service hostnames}
      APEX_PRIVATE_SINK_HOSTS: ${APEX_PRIVATE_SINK_HOSTS:?set to the exact comma-separated sink hostnames this deployment trusts, e.g. clickhouse-projection,archive-provider}
      APEX_CLICKHOUSE_CA_FILE: /run/secrets/clickhouse_client_ca
      APEX_CLICKHOUSE_CLIENT_CERT_FILE: /run/secrets/ingest_clickhouse_client_cert
      APEX_CLICKHOUSE_CLIENT_KEY_FILE: /run/secrets/ingest_clickhouse_client_key
      APEX_ARCHIVE_ENDPOINT: ${APEX_ARCHIVE_ENDPOINT:-https://archive-provider:8443/v1/events}
      APEX_ARCHIVE_CA_FILE: /run/secrets/archive_client_ca
      APEX_ARCHIVE_CLIENT_CERT_FILE: /run/secrets/ingest_archive_client_cert
      APEX_ARCHIVE_CLIENT_KEY_FILE: /run/secrets/ingest_archive_client_key
      APEX_BEARER_TOKEN_FILE: /run/secrets/ingest_bearer_token
      APEX_FILE_BEARER_MODE: ${APEX_FILE_BEARER_MODE:?set to single-agent-staging only for a single-agent staging deployment}
      APEX_BEARER_AGENT_ID: ${APEX_BEARER_AGENT_ID:?set APEX_BEARER_AGENT_ID to the workload agent identifier}
      APEX_BEARER_CERT_SHA256: ${APEX_BEARER_CERT_SHA256:?set APEX_BEARER_CERT_SHA256 to the authorized client certificate SHA-256 fingerprint}
      APEX_ALLOWED_SCOPES: ${APEX_ALLOWED_SCOPES:?set APEX_ALLOWED_SCOPES to comma-separated workspace/namespace scopes}
      APEX_OUTBOX_FILE: /var/lib/apex/outbox.jsonl
      APEX_OUTBOX_BASE: /var/lib/apex
      APEX_IDEMPOTENCY_FILE: /var/lib/apex/idempotency.jsonl
      APEX_IDEMPOTENCY_BASE: /var/lib/apex
      APEX_GATEWAY_SERVER_CERT_FILE: /run/secrets/gateway_server_cert
      APEX_GATEWAY_SERVER_KEY_FILE: /run/secrets/gateway_server_key
      APEX_GATEWAY_CLIENT_CA_FILE: /run/secrets/gateway_client_ca
      APEX_RETRY_ATTEMPTS: ${APEX_RETRY_ATTEMPTS:-3}
      APEX_IDEMPOTENCY_CAPACITY: ${APEX_IDEMPOTENCY_CAPACITY:-50000}
    depends_on:
      jetstream:
        condition: service_started
      clickhouse:
        condition: service_started
      archive-store:
        condition: service_started
      clickhouse-projection:
        condition: service_started
      archive-provider:
        condition: service_started
    networks: [apex-internal]
    secrets:
      - nats_client_ca
      - ingest_nats_client_cert
      - source: ingest_nats_client_key
        target: /run/secrets/ingest_nats_client_key
        mode: "0400"
      - source: nats_username
        target: /run/secrets/nats_username
        mode: "0400"
      - source: nats_password
        target: /run/secrets/nats_password
        mode: "0400"
      - clickhouse_client_ca
      - ingest_clickhouse_client_cert
      - source: ingest_clickhouse_client_key
        target: /run/secrets/ingest_clickhouse_client_key
        mode: "0400"
      - archive_client_ca
      - ingest_archive_client_cert
      - source: ingest_archive_client_key
        target: /run/secrets/ingest_archive_client_key
        mode: "0400"
      - source: ingest_bearer_token
        target: /run/secrets/ingest_bearer_token
        mode: "0400"
      - gateway_server_cert
      - source: gateway_server_key
        target: /run/secrets/gateway_server_key
        mode: "0400"
      - gateway_client_ca
    ports:
      - "${APEX_INGEST_BIND:-127.0.0.1}:${APEX_INGEST_PORT:-8443}:8443"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ingest-outbox:/var/lib/apex

  # Out-of-band control gateway (ADR-0006). Deployed as its own container, on
  # its own port, with its own TLS material, its own operator credential
  # table, and its own durable outbox volume. That separation is the whole
  # point: "reachable independently of the ingest/data path" is only true once
  # this is a service of its own, not code that happens to be authenticated
  # differently inside somebody else's process.
  #
  # Note there is no depends_on for jetstream/clickhouse/archive here, unlike
  # ingest-gateway. Deliberate: a command is durable the moment its outbox row
  # commits, so this gateway must be able to start and accept commands while
  # the primary data path is down. Adding a dependency edge would reintroduce
  # exactly the coupling ADR-0006 exists to remove.
  control-plane-api:
    image: ${APEX_CONTROL_IMAGE:?set APEX_CONTROL_IMAGE to an approved, digest-pinned image}
    command: ["/usr/local/bin/apex-control-plane-api"]
    environment:
      APEX_CONTROL_TRUSTED_SECRET_BASE: /run/secrets
      APEX_CONTROL_BIND_ADDR: 0.0.0.0:9443
      # Required because the listener above is not loopback. The process
      # terminates mTLS itself and requires an operator client certificate;
      # this stays an explicit acknowledgement that the control channel is
      # reachable off-host at all. See apps/control-plane-api/src/startup/env.rs.
      APEX_CONTROL_ALLOW_NONLOCAL_BIND: "true"
      APEX_CONTROL_SERVER_CERT_FILE: /run/secrets/control_server_cert
      APEX_CONTROL_SERVER_KEY_FILE: /run/secrets/control_server_key
      APEX_CONTROL_CLIENT_CA_FILE: /run/secrets/control_client_ca
      # A file, never an `environment:` value. Compose environment is visible
      # to `docker inspect` and /proc/<pid>/environ; these are bearer
      # credentials that authorize stop/pause/inject against live agents.
      #
      # This static table is one of two credential paths. The other, and the
      # one [[Authentication and Identity]] describes for a real deployment, is
      # a short-lived scope-bound credential issued by Keycloak through RFC
      # 8693 token exchange and verified here. To switch: delete this line and
      # the control_operator_tokens secret below, and set
      # APEX_CONTROL_KEYCLOAK_ISSUER / _AUDIENCE / _CA_FILE (plus the optional
      # claim-mapping settings documented in .env.example and
      # apps/control-plane-api/src/main.rs). Setting both is a hard startup
      # error rather than a precedence rule -- two configured credential
      # sources means one of them is being silently ignored, and this is the
      # surface where that matters most. The `*` break-glass scope is
      # unreachable through Keycloak unless
      # APEX_CONTROL_KEYCLOAK_GLOBAL_ROLE *and*
      # APEX_CONTROL_KEYCLOAK_GLOBAL_SUBJECTS are both configured; no claim can
      # confer it on its own.
      APEX_CONTROL_OPERATOR_TOKENS_FILE: /run/secrets/control_operator_tokens
      # The *agent workload* credential table, for PollCommands. A separate
      # file and a separate credential space from the operator table above,
      # because they authorize different principals: an operator issues a
      # `stop`, an agent retrieves the ones issued against it (ADR-0006). Each
      # entry is `token|cert_sha256|agent_id|workspace/namespace[,...]`; the
      # fingerprint pins the credential to one mTLS client certificate, so a
      # leaked token is unusable from any other connection. There is no `*`
      # form -- an agent workload has exactly one identity.
      #
      # Without this the gateway starts and says so on stderr, and accepts
      # commands no agent can ever retrieve.
      APEX_CONTROL_AGENT_TOKENS_FILE: /run/secrets/control_agent_tokens
      # A distinct outbox file from event-ingest's, by design: the two
      # services must not share a durability boundary any more than they
      # share auth.
      APEX_CONTROL_OUTBOX_BASE: /var/lib/apex-control
      APEX_CONTROL_OUTBOX_FILE: commands.jsonl
      # Delivery state ("has the target agent retrieved this yet"), a
      # different dimension from the outbox's fanout completion and tracked
      # separately. Defaults to APEX_CONTROL_OUTBOX_BASE; named here so the
      # journal is visible on the same durability volume.
      APEX_CONTROL_INBOX_FILE: inbox.jsonl
      # Fanout to the primary trace, so an accepted command becomes an actual
      # `control` event rather than a durable row nobody reads. Its own NATS
      # client leaf and its own broker account, never the ingest gateway's:
      # ADR-0006's credential separation has to hold at the broker too, or
      # "independently authenticated" stops at the gRPC edge.
      #
      # There is still no `depends_on: jetstream` below, deliberately. The
      # worker connects lazily on its own tick and retries forever; an
      # unreachable broker defers `delivered` and the trace write, and affects
      # nothing about whether this gateway starts or accepts commands.
      APEX_CONTROL_NATS_URL: ${APEX_CONTROL_NATS_URL:-tls://jetstream:4222}
      APEX_CONTROL_NATS_CA_FILE: /run/secrets/nats_client_ca
      APEX_CONTROL_NATS_CLIENT_CERT_FILE: /run/secrets/control_nats_client_cert
      APEX_CONTROL_NATS_CLIENT_KEY_FILE: /run/secrets/control_nats_client_key
      APEX_CONTROL_NATS_USERNAME_FILE: /run/secrets/control_nats_username
      APEX_CONTROL_NATS_PASSWORD_FILE: /run/secrets/control_nats_password
      APEX_CONTROL_FANOUT_INTERVAL_SECS: ${APEX_CONTROL_FANOUT_INTERVAL_SECS:-5}
      # Per-operator admission ceiling. Without a shared store (see
      # APEX_CONTROL_VALKEY_* in .env.example) this is enforced *per replica*,
      # so N replicas of this service admit N x the limit. A single-replica
      # deployment is unaffected; a multi-replica one should configure the
      # control gateway's own Valkey instance and run an image built with
      # --features valkey.
      APEX_CONTROL_ADMISSION_LIMIT: ${APEX_CONTROL_ADMISSION_LIMIT:-50}
      APEX_CONTROL_ADMISSION_WINDOW_SECS: ${APEX_CONTROL_ADMISSION_WINDOW_SECS:-1}
    networks: [apex-internal]
    secrets:
      - control_server_cert
      - source: control_server_key
        target: /run/secrets/control_server_key
        mode: "0400"
      - control_client_ca
      - source: control_operator_tokens
        target: /run/secrets/control_operator_tokens
        mode: "0400"
      - source: control_agent_tokens
        target: /run/secrets/control_agent_tokens
        mode: "0400"
      - nats_client_ca
      - control_nats_client_cert
      - source: control_nats_client_key
        target: /run/secrets/control_nats_client_key
        mode: "0400"
      - source: control_nats_username
        target: /run/secrets/control_nats_username
        mode: "0400"
      - source: control_nats_password
        target: /run/secrets/control_nats_password
        mode: "0400"
    ports:
      - "${APEX_CONTROL_BIND:-127.0.0.1}:${APEX_CONTROL_PORT:-9443}:9443"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - control-outbox:/var/lib/apex-control

  jetstream:
    image: ${NATS_IMAGE:?set NATS_IMAGE to an approved, digest-pinned image}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["! grep -q 'REPLACE_WITH' /run/secrets/nats_config && exec nats-server --config=/run/secrets/nats_config"]
    volumes:
      - jetstream-data:/data
    networks: [apex-internal]
    secrets:
      - source: nats_config
        target: nats_config
      - source: nats_server_cert
        target: nats_server_cert
      - source: nats_server_key
        target: nats_server_key
        mode: "0400"
      - source: nats_client_ca
        target: nats_client_ca
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?set CLICKHOUSE_IMAGE to an approved, digest-pinned image}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["! grep -q 'REPLACE_WITH' /run/secrets/clickhouse_users && exec /entrypoint.sh clickhouse-server"]
    secrets:
      - source: clickhouse_users
        target: clickhouse_users
      - source: clickhouse_users
        target: /etc/clickhouse-server/users.d/apex.xml
      - source: clickhouse_tls_config
        target: /etc/clickhouse-server/config.d/apex-tls.xml
      - source: clickhouse_server_cert
        target: clickhouse_server_cert
      - source: clickhouse_server_key
        target: clickhouse_server_key
        mode: "0400"
      - source: clickhouse_client_ca
        target: clickhouse_client_ca
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks: [apex-internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  clickhouse-projection:
    image: ${CLICKHOUSE_API_IMAGE:?set CLICKHOUSE_API_IMAGE to an approved, digest-pinned image}
    environment:
      # The provider binds its write API to exactly one mTLS client leaf: the
      # ingest gateway. Without this the provider fails closed and returns 403
      # to every write, because the only alternative -- the
      # APEX_PROVIDER_ALLOW_UNPINNED_CLIENT escape hatch -- accepts any
      # CA-trusted client and must never be set in a production profile.
      # This is the same fingerprint as APEX_BEARER_CERT_SHA256 whenever the
      # gateway presents one client certificate to both its sinks.
      APEX_PROVIDER_CLIENT_CERT_SHA256: ${APEX_PROVIDER_CLIENT_CERT_SHA256:?set APEX_PROVIDER_CLIENT_CERT_SHA256 to the SHA-256 fingerprint of the ingest gateway client certificate}
      APEX_LISTEN_ADDR: 0.0.0.0:8443
      APEX_CLICKHOUSE_URL: https://clickhouse:8443
      APEX_CLICKHOUSE_DATABASE: apex
      APEX_CLICKHOUSE_TABLE: events
      APEX_MAX_EVENT_BYTES: 262144
      APEX_SERVER_CERT_FILE: /run/secrets/clickhouse_api_server_cert
      APEX_SERVER_KEY_FILE: /run/secrets/clickhouse_api_server_key
      APEX_CLIENT_CA_FILE: /run/secrets/clickhouse_api_client_ca
      APEX_CLICKHOUSE_CLIENT_CERT_FILE: /run/secrets/clickhouse_writer_cert
      APEX_CLICKHOUSE_CLIENT_KEY_FILE: /run/secrets/clickhouse_writer_key
    depends_on:
      clickhouse:
        condition: service_started
    networks: [apex-internal]
    secrets:
      - source: clickhouse_api_server_cert
        target: /run/secrets/clickhouse_api_server_cert
      - source: clickhouse_api_server_key
        target: /run/secrets/clickhouse_api_server_key
        mode: "0400"
      - source: clickhouse_api_client_ca
        target: /run/secrets/clickhouse_api_client_ca
      - source: clickhouse_writer_cert
        target: /run/secrets/clickhouse_writer_cert
      - source: clickhouse_writer_key
        target: /run/secrets/clickhouse_writer_key
        mode: "0400"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  archive-provider:
    image: ${ARCHIVE_API_IMAGE:?set ARCHIVE_API_IMAGE to an approved, digest-pinned image}
    environment:
      # See clickhouse-projection: without this pin the provider 403s every
      # write, and the unpinned escape hatch is not acceptable in production.
      APEX_PROVIDER_CLIENT_CERT_SHA256: ${APEX_PROVIDER_CLIENT_CERT_SHA256:?set APEX_PROVIDER_CLIENT_CERT_SHA256 to the SHA-256 fingerprint of the ingest gateway client certificate}
      APEX_LISTEN_ADDR: 0.0.0.0:8443
      APEX_ARCHIVE_BACKEND_URL: https://archive-store:9000
      APEX_ARCHIVE_BUCKET: ${APEX_ARCHIVE_BUCKET:-apex-events}
      APEX_MAX_EVENT_BYTES: 262144
      APEX_SERVER_CERT_FILE: /run/secrets/archive_api_server_cert
      APEX_SERVER_KEY_FILE: /run/secrets/archive_api_server_key
      APEX_CLIENT_CA_FILE: /run/secrets/archive_api_client_ca
      APEX_ARCHIVE_CLIENT_CERT_FILE: /run/secrets/archive_writer_cert
      APEX_ARCHIVE_CLIENT_KEY_FILE: /run/secrets/archive_writer_key
      APEX_ARCHIVE_ACCESS_KEY_FILE: /run/secrets/archive_backend_access_key
      APEX_ARCHIVE_SECRET_KEY_FILE: /run/secrets/archive_backend_secret_key
      APEX_ARCHIVE_REQUIRE_OBJECT_LOCK: ${APEX_ARCHIVE_REQUIRE_OBJECT_LOCK:?set APEX_ARCHIVE_REQUIRE_OBJECT_LOCK=true for strict retention or false only for staging}
    depends_on:
      archive-store-init:
        condition: service_completed_successfully
    networks: [apex-internal]
    secrets:
      - source: archive_api_server_cert
        target: /run/secrets/archive_api_server_cert
      - source: archive_api_server_key
        target: /run/secrets/archive_api_server_key
        mode: "0400"
      - source: archive_api_client_ca
        target: /run/secrets/archive_api_client_ca
      - source: archive_writer_cert
        target: /run/secrets/archive_writer_cert
      - source: archive_writer_key
        target: /run/secrets/archive_writer_key
        mode: "0400"
      - source: archive_backend_access_key
        target: /run/secrets/archive_backend_access_key
        mode: "0400"
      - source: archive_backend_secret_key
        target: /run/secrets/archive_backend_secret_key
        mode: "0400"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  archive-store:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE to an approved, digest-pinned image}
    command: server --certs-dir /run/minio-certs /data
    environment:
      MINIO_BROWSER: "off"
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
      - source: minio_server_cert
        target: /run/minio-certs/public.crt
      - source: minio_server_key
        target: /run/minio-certs/private.key
        mode: "0400"
    volumes:
      - archive-data:/data
    networks: [apex-internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  archive-store-init:
    image: ${MINIO_MC_IMAGE:?set MINIO_MC_IMAGE to an approved, digest-pinned MinIO client image}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        user="$$(cat /run/secrets/minio_root_user)" || { echo 'archive-store-init: cannot read MinIO root username' >&2; exit 1; }
        password="$$(cat /run/secrets/minio_root_password)" || { echo 'archive-store-init: cannot read MinIO root password' >&2; exit 1; }
        bucket="$${APEX_ARCHIVE_BUCKET}"
        test "$$user" != REPLACE_WITH || { echo 'archive-store-init: replace the MinIO root username placeholder' >&2; exit 1; }
        test "$$password" != REPLACE_WITH || { echo 'archive-store-init: replace the MinIO root password placeholder' >&2; exit 1; }
        case "$$bucket" in *[!a-z0-9.-]*|'') echo 'archive-store-init: bucket must be lowercase DNS-safe text' >&2; exit 1;; esac
        test "$${#bucket}" -ge 3 && test "$${#bucket}" -le 63 || { echo 'archive-store-init: bucket length must be 3 through 63 characters' >&2; exit 1; }
        case "$$user" in *[!A-Za-z0-9_-]*|'') echo 'invalid MinIO root username format' >&2; exit 1;; esac
        case "$$password" in *[!A-Za-z0-9._~-]*|'') echo 'invalid MinIO root password format' >&2; exit 1;; esac
        mkdir -p /tmp/mc/certs/CAs
        cp /run/secrets/minio_server_ca /tmp/mc/certs/CAs/minio-server-ca.pem || { echo 'archive-store-init: cannot install MinIO server CA' >&2; exit 1; }
        chmod 0400 /tmp/mc/certs/CAs/minio-server-ca.pem
        printf '{"version":"10","aliases":{"apex":{"url":"https://archive-store:9000","accessKey":"%s","secretKey":"%s","api":"S3v4","path":"auto"}}}' "$$user" "$$password" > /tmp/mc/config.json
        chmod 0400 /tmp/mc/config.json
        MC_CONFIG_DIR=/tmp/mc mc alias import apex /tmp/mc/config.json || { echo 'archive-store-init: failed to configure the TLS MinIO client' >&2; exit 1; }
        MC_CONFIG_DIR=/tmp/mc mc mb --with-lock --ignore-existing "apex/$$bucket" || { echo 'archive-store-init: failed to create the Object-Lock bucket' >&2; exit 1; }
        MC_CONFIG_DIR=/tmp/mc mc retention info "apex/$$bucket" || { echo 'archive-store-init: Object-Lock verification failed' >&2; exit 1; }
    environment:
      APEX_ARCHIVE_BUCKET: ${APEX_ARCHIVE_BUCKET:?set APEX_ARCHIVE_BUCKET to the archive bucket name}
    depends_on:
      archive-store:
        condition: service_started
    networks: [apex-internal]
    secrets:
      - source: minio_root_user
        target: /run/secrets/minio_root_user
        mode: "0400"
      - source: minio_root_password
        target: /run/secrets/minio_root_password
        mode: "0400"
      - source: minio_server_ca
        target: /run/secrets/minio_server_ca
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: "no"

networks:
  apex-internal:
    internal: true

volumes:
  ingest-outbox:
  # Separate from ingest-outbox on purpose: a control command must survive
  # independently of the ingest path's durability state.
  control-outbox:
  jetstream-data:
  clickhouse-data:
  archive-data:

secrets:
  # OOB control gateway material. Separate certificates and a separate client
  # CA from the ingest gateway's, so an ingest workload certificate cannot
  # open a control connection and vice versa.
  control_server_cert:
    file: ${CONTROL_SERVER_CERT_FILE:?set CONTROL_SERVER_CERT_FILE to a control gateway certificate}
  control_server_key:
    file: ${CONTROL_SERVER_KEY_FILE:?set CONTROL_SERVER_KEY_FILE to a control gateway private key}
  control_client_ca:
    file: ${CONTROL_CLIENT_CA_FILE:?set CONTROL_CLIENT_CA_FILE to the CA that issues operator client certificates}
  control_operator_tokens:
    file: ${CONTROL_OPERATOR_TOKENS_FILE:?set CONTROL_OPERATOR_TOKENS_FILE to an operator credential table file}
  # `token|cert_sha256|agent_id|workspace/namespace[,...]` per line or
  # `;`-separated. Distinct from the operator table: retrieving a command is a
  # different authority from issuing one.
  control_agent_tokens:
    file: ${CONTROL_AGENT_TOKENS_FILE:?set CONTROL_AGENT_TOKENS_FILE to an agent workload credential table file}
  # The control gateway's own NATS client leaf and broker account, separate
  # from ingest_nats_client_* / nats_username / nats_password. Grant this
  # account publish on the event subjects only -- it never manages streams --
  # so a compromise of one service does not hand over the other's broker
  # rights.
  control_nats_client_cert:
    file: ${CONTROL_NATS_CLIENT_CERT_FILE:?set CONTROL_NATS_CLIENT_CERT_FILE to the control gateway NATS client certificate}
  control_nats_client_key:
    file: ${CONTROL_NATS_CLIENT_KEY_FILE:?set CONTROL_NATS_CLIENT_KEY_FILE to the control gateway NATS client key}
  control_nats_username:
    file: ${CONTROL_NATS_USERNAME_FILE:?set CONTROL_NATS_USERNAME_FILE to the control gateway NATS user file}
